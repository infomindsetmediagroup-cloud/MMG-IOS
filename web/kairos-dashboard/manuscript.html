  <title>Manuscript Studio | Kairos</title>
  <style>
    :root {
      color-scheme: dark;
      background: #05070a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #05070a;
      color: #f7f9fc;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    #kairos-manuscript-route-boot {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 15%, rgba(22, 119, 255, 0.14), transparent 34rem),
        #05070a;
    }

    .kairos-manuscript-route-card {
      width: min(560px, 100%);
      padding: 28px;
      border: 1px solid #263547;
      border-radius: 22px;
      background: #0b1017;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
    }

    .kairos-manuscript-route-eyebrow {
      margin: 0 0 10px;
      color: #7fb4ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .kairos-manuscript-route-card h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 8vw, 42px);
      line-height: 1.05;
    }

    .kairos-manuscript-route-status {
      margin: 0;
      color: #b8c5d6;
      font-size: 16px;
      line-height: 1.55;
    }

    .kairos-manuscript-route-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .kairos-manuscript-route-actions[hidden] { display: none; }

    .kairos-manuscript-route-actions button,
    .kairos-manuscript-route-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid #31527d;
      border-radius: 12px;
      background: #111923;
      color: #fff;
      font: 800 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .kairos-manuscript-route-actions button:first-child {
      border-color: #4593ff;
      background: #1677ff;
    }

    @media (max-width: 700px) {
      .kairos-manuscript-route-card {
        padding: 22px;
        border-radius: 18px;
      }

      .kairos-manuscript-route-actions > * { width: 100%; }
    }
  </style>
  <script>
    (() => {
      const BUILD = "kairos-dedicated-manuscript-route-20260804-5-final-deliverable";
      const current = new URL(location.href);
      if (current.searchParams.get("open") !== "manuscript") {
        current.searchParams.set("open", "manuscript");
        history.replaceState(null, "", current.href);
      }

      document.documentElement.dataset.kairosMode = "manuscript";
      globalThis.__KAIROS_MANUSCRIPT_OPEN_TIMEOUT_MS = 20_000;
      globalThis.__KAIROS_EDITORIAL_REQUEST_TIMEOUT_MS__ = 6_000;

      const route = {
        build: BUILD,
        opened: false,
        fail(message) {
          const boot = document.querySelector("#kairos-manuscript-route-boot");
          if (!boot) return;
          const title = boot.querySelector("[data-kairos-route-title]");
          const status = boot.querySelector("[data-kairos-route-status]");
          const actions = boot.querySelector("[data-kairos-route-actions]");
          if (title) title.textContent = "Manuscript Studio did not open";
          if (status) status.textContent = String(message || "The dedicated manuscript runtime could not load.");
          if (actions) actions.hidden = false;
          boot.setAttribute("role", "alert");
        },
      };

      globalThis.KairosDedicatedManuscriptRoute = route;

      window.addEventListener("kairos:manuscript-studio:opened", () => {
        route.opened = true;
        document.querySelector("#kairos-manuscript-route-boot")?.remove();
      }, { once: true });

      window.setTimeout(() => {
        if (route.opened) return;
        if (document.querySelector("#manuscript-studio-overlay")) return;
        if (document.querySelector("#kairos-manuscript-direct-open-shell")) return;
        route.fail("The dedicated manuscript runtime did not become visible. Reload this page to retry.");
      }, 25_000);
    })();
  </script>
</head>
<body data-kairos-dedicated-manuscript="true">
  <main id="kairos-manuscript-route-boot" role="status" aria-live="polite">
    <section class="kairos-manuscript-route-card">
      <p class="kairos-manuscript-route-eyebrow">Mindset Media Group · Kairos</p>
      <h1 data-kairos-route-title>Opening Manuscript Studio</h1>
      <p class="kairos-manuscript-route-status" data-kairos-route-status>Loading the dedicated manuscript workspace…</p>
      <div class="kairos-manuscript-route-actions" data-kairos-route-actions hidden>
        <button type="button" onclick="location.reload()">Retry Manuscript Studio</button>
        <a href="./">Return to Command Center</a>
      </div>
    </section>
  </main>

  <noscript>Manuscript Studio requires JavaScript to run.</noscript>

  <!-- Compatibility contract only. The executable asset below uses the v2 cache key.
       manuscript-editorial-watchdog.js?v=manuscript-editorial-recovery-20260804-1 -->
  <script
    src="./scripts/manuscript-editorial-watchdog.js?v=manuscript-editorial-recovery-20260804-2-stall-escape"
    onerror="KairosDedicatedManuscriptRoute.fail('The Editorial Workbench recovery boundary failed to load.')"></script>
  <script>
    (() => {
      const BUILD = "kairos-inline-editorial-hard-stop-20260804-1";
      const WATCHDOG_PATCH = "kairos-manuscript-editorial-stall-escape-20260804-2";
      const DEADLINE_MS = 10_000;
      let armedAt = 0;
      let timer = 0;

      globalThis.KairosInlineEditorialHardStop = Object.freeze({
        build: BUILD,
        ready: true,
        inspect,
        snapshot: () => ({
          build: BUILD,
          armedAt: armedAt || null,
          watchdogPatch: globalThis.KairosManuscriptEditorialWatchdog?.patchBuild || null,
          recoveryVisible: Boolean(document.querySelector("[data-kairos-inline-editorial-escape]")),
        }),
      });

      document.addEventListener("click", event => {
        const target = event.target instanceof Element ? event.target : null;
        const resume = target?.closest?.("[data-kairos-inline-resume-final]");
        const retry = target?.closest?.("[data-kairos-inline-reload]");
        if (!resume && !retry) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        if (retry) {
          const next = new URL(location.href);
          next.searchParams.set("open", "manuscript");
          next.searchParams.set("editorialHardStop", BUILD);
          next.searchParams.set("cacheBust", String(Date.now()));
          location.replace(next.href);
          return;
        }

        const projectId = activeProjectId();
        const engine = globalThis.KairosManuscriptFinalDeliverableEngine
          || globalThis.KairosManuscriptPipelineOrchestrator;
        if (engine?.manufacture) {
          void engine.manufacture(projectId);
          return;
        }

        const section = document.querySelector("#manuscript-editorial-workbench");
        if (section) {
          section.innerHTML = `
            <p class="eyebrow">Final deliverable recovery</p>
            <h3>The final-deliverable engine is still loading</h3>
            <p>Kairos will reload the current saved project with a fresh runtime.</p>
            <div class="manuscript-actions">
              <button type="button" class="primary" data-kairos-inline-reload>Reload Saved Project</button>
            </div>
          `;
        }
      }, true);

      window.addEventListener("kairos:manuscript-studio:opened", arm, { once: true });
      window.addEventListener("pageshow", arm);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") arm();
      });
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm, { once: true });
      else queueMicrotask(arm);

      function arm() {
        if (!armedAt) armedAt = Date.now();
        clearTimeout(timer);
        timer = setTimeout(inspect, 250);
      }

      function inspect() {
        const section = document.querySelector("#manuscript-editorial-workbench");
        if (!section) {
          timer = setTimeout(inspect, 250);
          return;
        }

        if (section.hasAttribute("data-kairos-editorial-stall-escape")
          || section.hasAttribute("data-kairos-inline-editorial-escape")) return;

        if (!/loading editorial workbench/i.test(section.textContent || "")) {
          armedAt = 0;
          return;
        }

        if (!armedAt) armedAt = Date.now();
        const elapsed = Date.now() - armedAt;
        if (elapsed < DEADLINE_MS) {
          timer = setTimeout(inspect, Math.max(100, DEADLINE_MS - elapsed));
          return;
        }

        const watchdog = globalThis.KairosManuscriptEditorialWatchdog;
        if (watchdog?.patchBuild === WATCHDOG_PATCH) {
          watchdog.inspect("inline-hard-stop-deadline");
          if (section.hasAttribute("data-kairos-editorial-stall-escape")) return;
        }

        section.setAttribute("data-kairos-inline-editorial-escape", BUILD);
        section.removeAttribute("aria-busy");
        section.setAttribute("role", "alert");
        section.innerHTML = `
          <p class="eyebrow">Editorial recovery</p>
          <h3>Editorial loading was stopped</h3>
          <p>Kairos will not leave this project on a permanent loading screen. The saved manuscript, cover, metadata, editorial state, and assignment remain intact.</p>
          <p class="manuscript-note">Project: ${escapeHTML(activeProjectId() || "active manuscript")}</p>
          <div class="manuscript-actions">
            <button type="button" class="primary" data-kairos-inline-resume-final>Resume Final Deliverable</button>
            <button type="button" class="secondary" data-kairos-inline-reload>Reload Saved Project</button>
          </div>
        `;
        section.scrollIntoView({ block: "center" });
      }

      function activeProjectId() {
        const direct = new URL(location.href).searchParams.get("project") || "";
        if (direct) return direct;
        try {
          const record = JSON.parse(sessionStorage.getItem("kairos.production.active-workspace") || "null");
          return String(record?.projectId || record?.id || "").trim();
        } catch {
          return "";
        }
      }

      function escapeHTML(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    })();
  </script>

    src="./scripts/manuscript-project-preservation-bridge.js?v=kairos-manuscript-project-preservation-20260801-1"
    onerror="KairosDedicatedManuscriptRoute.fail('The manuscript state-preservation bridge failed to load.')"></script>

  <script

  <script
    type="module"
    src="./scripts/safari-manuscript-intake-compat.js?v=safari-native-docx-20260730-1"
    onerror="KairosDedicatedManuscriptRoute.fail('Safari manuscript compatibility failed to load.')"></script>

  <script type="module">
    const RUNTIME_BOOTSTRAP = "kairos-manuscript-runtime-bootstrap-20260804-7-editorial-hard-stop";

    globalThis.__KAIROS_MANUSCRIPT_RUNTIME_READY__ = (async () => {
      await import("./scripts/manuscript-registry-bridge.js?v=kairos-manuscript-registry-bridge-20260804-4-restored-source-cache");

      if (!globalThis.KairosManuscriptRegistryBridge?.ready) {
        throw new Error("The manuscript registry bridge did not become ready.");
      }

      await globalThis.KairosManuscriptRegistryBridge.stateFetchReady();
      await import("./scripts/manuscript-deadlock-recovery.js?v=kairos-manuscript-deadlock-recovery-20260804-2");
      await import("./scripts/manuscript-dedicated-project-restore.js?v=kairos-manuscript-dedicated-restore-20260804-2-source-cache");
      await import("./scripts/manuscript-direct-open-controller.js?v=manuscript-flow-recovery-20260803-3");

      if (!globalThis.KairosManuscriptFinalDeliverableEngine?.ready) {
        throw new Error("The final deliverable engine did not become ready.");
      }
      if (!globalThis.KairosManuscriptFinalDeliverableControlOwner?.ready) {
        throw new Error("The final deliverable controls did not become ready.");
      }
      if (globalThis.KairosManuscriptEditorialWatchdog?.patchBuild !== "kairos-manuscript-editorial-stall-escape-20260804-2") {
        throw new Error("The current Editorial Workbench recovery build did not load.");
      }
      if (!globalThis.KairosInlineEditorialHardStop?.ready) {
        throw new Error("The inline Editorial Workbench hard stop did not load.");
      }

      return {
        status: "ready",
        build: RUNTIME_BOOTSTRAP,
        registryBuild: globalThis.KairosManuscriptRegistryBridge.build,
        restoreBuild: globalThis.KairosManuscriptDedicatedRestore?.build || null,
        finalDeliverableBuild: globalThis.KairosManuscriptFinalDeliverableEngine.build,
        finalDeliverableControlBuild: globalThis.KairosManuscriptFinalDeliverableControlOwner.build,
        editorialWatchdogBuild: globalThis.KairosManuscriptEditorialWatchdog.build,
        editorialWatchdogPatch: globalThis.KairosManuscriptEditorialWatchdog.patchBuild,
        inlineEditorialHardStopBuild: globalThis.KairosInlineEditorialHardStop.build,
      };
    })();

    try {
      await globalThis.__KAIROS_MANUSCRIPT_RUNTIME_READY__;
    } catch (error) {
      KairosDedicatedManuscriptRoute.fail(
        error?.message || "The manuscript runtime failed to load.",
      );
    }
  </script>
</body>
