    :root { color-scheme: dark; background: #05070a; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: #05070a; color: #f5f8fb; }
    .kairos-first-paint { width: min(720px, 100%); margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .kairos-first-paint img { display: block; width: 100%; height: auto; aspect-ratio: 1264 / 468; border: 0; border-radius: 0; background: #020508; object-fit: contain; }
    .kairos-first-paint div { margin-top: 18px; padding: 22px; border: 1px solid #1b2b3a; border-radius: 20px; background: #0b1017; }
    .kairos-first-paint p { margin: 0; color: #9eb0bf; }
    .kairos-first-paint .eyebrow { margin-bottom: 8px; color: #72dcff; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }

  </style>
  <script>
    (() => {
      const current = new URL(location.href);
      const executiveRoute = current.searchParams.get("mode") === "executive";
      window.__KAIROS_COMMAND_FIRST_PAINT__ = !executiveRoute;
      if (executiveRoute) document.documentElement.dataset.kairosRoute = "executive";
      if (current.searchParams.get("open") !== "manuscript") return;

      const target = new URL("./manuscript", current);
      target.search = current.search;
      target.searchParams.delete("mode");
      target.searchParams.set("open", "manuscript");
      location.replace(target.href);
    })();
  </script>
