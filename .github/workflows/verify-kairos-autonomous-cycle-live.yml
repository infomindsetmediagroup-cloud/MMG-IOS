name: Verify Kairos Autonomous Cycle Live

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-kairos-autonomous-cycle-live.yml"
      - "cloudflare/mmg-ios/src/autonomy/**"
      - "cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js"
      - "cloudflare/mmg-ios/wrangler.toml"
  pull_request:
    paths:
      - ".github/workflows/verify-kairos-autonomous-cycle-live.yml"
      - "cloudflare/mmg-ios/src/autonomy/**"
      - "cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js"
      - "cloudflare/mmg-ios/wrangler.toml"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-kairos-autonomous-cycle-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify authenticated production cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      API_BUILD: kairos-autonomy-api-20260802-5-complete-operations
      CYCLE_BUILD: kairos-autonomous-operations-cycle-20260802-1
      PRIORITIZER_BUILD: kairos-business-prioritizer-20260802-1
      ORCHESTRATOR_BUILD: kairos-business-orchestrator-20260802-1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATUS_CONTEXT: kairos-autonomous-cycle-live

    steps:
      - name: Mark pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:process.env.STATUS_CONTEXT,description:"Rotating auth and verifying complete autonomous cycle",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate canonical identity and runtime contracts
        run: |
          set -euo pipefail
          node --check cloudflare/mmg-ios/src/autonomy/kairos-business-observation-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-autonomy-api-v5.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-autonomous-operations-cycle-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-business-prioritizer-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-business-orchestrator-v1.js
          grep -Fq '}t${generatedAt.slice(11, 19).replace(/:/gu, "")}z`' cloudflare/mmg-ios/src/autonomy/kairos-business-observation-v1.js
          grep -Fq "${API_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-autonomy-api-v5.js
          grep -Fq "${CYCLE_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-autonomous-operations-cycle-v1.js
          grep -Fq "${PRIORITIZER_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-business-prioritizer-v1.js
          grep -Fq "${ORCHESTRATOR_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-business-orchestrator-v1.js

      - name: Verify deployed public build boundary
        run: |
          set -euo pipefail
          headers_raw="${RUNNER_TEMP}/public.headers.raw"
          headers="${RUNNER_TEMP}/public.headers"
          body="${RUNNER_TEMP}/public.json"
          code="$(curl --silent --show-error --max-time 45 \
            -D "${headers_raw}" \
            "${WORKER_URL}/api/autonomy/status?preflight=${GITHUB_SHA}" \
            -o "${body}" \
            -w '%{http_code}')"
          tr -d '\r' < "${headers_raw}" > "${headers}"
          test "${code}" = "401" -o "${code}" = "503"
          grep -Fxiq "x-kairos-autonomy-api-build: ${API_BUILD}" "${headers}"
          grep -Fxiq 'x-kairos-inference-provider: browser-webgpu' "${headers}"
          grep -Fxiq 'x-kairos-external-provider: disabled' "${headers}"
          grep -Fxiq 'x-kairos-openai-calls: disabled' "${headers}"

      - name: Rotate and deploy production authentication secret
        if: github.event_name == 'push'
        working-directory: cloudflare/mmg-ios
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          token_file="${RUNNER_TEMP}/kairos-cycle-token"
          umask 077
          printf '%s' "${token}" > "${token_file}"
          echo "KAIROS_CYCLE_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"

          npm install --ignore-scripts --no-audit --no-fund
          version_tag="kairos-cycle-${GITHUB_RUN_ID}"
          printf '%s' "${token}" | npx wrangler versions secret put KAIROS_AUTONOMY_API_TOKEN \
            --tag "${version_tag}" \
            --message "Rotate Kairos autonomous-cycle verification token"
          npx wrangler versions deploy \
            --version-tag "${version_tag}" \
            --percentage 100 \
            --message "Activate canonical autonomous-cycle release" \
            -y

          for attempt in $(seq 1 36); do
            code="$(curl --silent --show-error --max-time 30 \
              "${WORKER_URL}/api/autonomy/status?rotation=${GITHUB_SHA}-${attempt}" \
              -o "${RUNNER_TEMP}/rotation.json" \
              -w '%{http_code}' || true)"
            if [ "${code}" = "401" ]; then
              exit 0
            fi
            sleep 5
          done
          cat "${RUNNER_TEMP}/rotation.json" || true
          exit 1

      - name: Verify authenticated readiness and complete cycle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          token="$(cat "${KAIROS_CYCLE_TOKEN_FILE}")"
          echo "::add-mask::${token}"

          status_body="${RUNNER_TEMP}/authenticated-status.json"
          status_code="$(curl --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${token}" \
            "${WORKER_URL}/api/autonomy/status?verification=${GITHUB_SHA}" \
            -o "${status_body}" \
            -w '%{http_code}')"
          test "${status_code}" = "200"

          STATUS_BODY="${status_body}" API_BUILD="${API_BUILD}" CYCLE_BUILD="${CYCLE_BUILD}" PRIORITIZER_BUILD="${PRIORITIZER_BUILD}" ORCHESTRATOR_BUILD="${ORCHESTRATOR_BUILD}" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.STATUS_BODY, "utf8"));
          if (value?.ok !== true || value?.build !== process.env.API_BUILD) throw new Error("Authenticated API status mismatch.");
          if (value?.autonomousOperations?.ready !== true) throw new Error("Autonomous operations are not ready.");
          if (value.autonomousOperations.cycleBuild !== process.env.CYCLE_BUILD) throw new Error("Cycle build mismatch.");
          if (value.autonomousOperations.prioritizerBuild !== process.env.PRIORITIZER_BUILD) throw new Error("Prioritizer build mismatch.");
          if (value.autonomousOperations.orchestratorBuild !== process.env.ORCHESTRATOR_BUILD) throw new Error("Orchestrator build mismatch.");
          if (value.businessObservation?.externalMutationEnabled !== false) throw new Error("External mutation must remain disabled.");
          if (value.businessObservation?.approvalBoundaryEnabled !== true) throw new Error("Approval boundary must remain enabled.");
          NODE

          cycle_body="${RUNNER_TEMP}/cycle.json"
          cycle_code="$(curl --silent --show-error --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data '{"tenantId":"mmg"}' \
            "${WORKER_URL}/api/autonomy/business-state/collect?verification=${GITHUB_SHA}" \
            -o "${cycle_body}" \
            -w '%{http_code}')"
          cat "${cycle_body}"
          test "${cycle_code}" = "200"

          CYCLE_BODY="${cycle_body}" API_BUILD="${API_BUILD}" CYCLE_BUILD="${CYCLE_BUILD}" SUMMARY="${RUNNER_TEMP}/cycle-summary.json" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.CYCLE_BODY, "utf8"));
          if (value?.ok !== true || value?.build !== process.env.API_BUILD) throw new Error("Complete cycle API response failed.");
          const operations = value.operations;
          if (operations?.ok !== true || operations?.build !== process.env.CYCLE_BUILD) throw new Error("Complete operations cycle failed.");
          if (!operations?.persistence?.ok) throw new Error("Snapshot persistence failed.");
          if (!/^[a-z0-9][a-z0-9._:-]*$/u.test(operations.snapshotId)) throw new Error("Snapshot identity is not canonical.");
          if (/[A-Z]/u.test(operations.snapshotId)) throw new Error("Snapshot identity contains uppercase characters.");
          if (!operations?.plan?.planId) throw new Error("Priority plan is missing.");
          if (!operations?.orchestration || operations.orchestration.ok !== true) throw new Error("Orchestration failed.");
          const summary = {
            authenticated: true,
            ready: true,
            snapshotId: operations.snapshotId,
            planId: operations.plan.planId,
            cycleStatus: operations.status,
            persistence: operations.persistence.disposition,
            taskCount: operations.plan.taskCount,
            completedCount: operations.orchestration.counts.completed,
            blockedCount: operations.orchestration.counts.blocked,
            failedCount: operations.orchestration.counts.failed,
          };
          fs.writeFileSync(process.env.SUMMARY, JSON.stringify(summary, null, 2));
          NODE
          cat "${RUNNER_TEMP}/cycle-summary.json"

      - name: Upload sanitized verification evidence
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kairos-autonomous-cycle-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public.headers
            ${{ runner.temp }}/public.json
            ${{ runner.temp }}/authenticated-status.json
            ${{ runner.temp }}/cycle.json
            ${{ runner.temp }}/cycle-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ]; then
            state="success"
            description="Authenticated autonomous cycle verified end to end"
          else
            state="failure"
            description="Authenticated autonomous cycle verification failed"
          fi
          payload="$(STATE="${state}" DESCRIPTION="${description}" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.STATUS_CONTEXT,description:process.env.DESCRIPTION,target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
