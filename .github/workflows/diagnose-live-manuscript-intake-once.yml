name: Diagnose Live Manuscript Intake Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-manuscript-intake-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report diagnostic pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-manuscript-intake-diagnostic\",\"description\":\"Testing live 279045-character intake\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Probe live large manuscript intake
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/manuscript-intake"
          mkdir -p "${work}"

          node <<'NODE' > "${work}/payload.json"
          const target = 279045;
          const seed = "Cinematic AI video creation, viral content systems, commercial prompt engineering, and modern AI filmmaking. ";
          let manuscript = seed.repeat(Math.ceil(target / seed.length)).slice(0, target);
          const payload = {
            title: "AI Video Prompt Mastery Live Intake Diagnostic",
            manuscript,
            source: {
              projectId: `diagnostic-${process.env.GITHUB_RUN_ID}`,
              name: "AI-Video-Prompt-Mastery.docx",
              filename: "AI-Video-Prompt-Mastery.docx",
              format: "docx",
              size: 15728640,
              textBytes: 279045,
              stored: true,
              uploadMode: "chunked-v1",
              checksum: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            }
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          status="$(curl --silent --show-error --max-time 60 \
            -D "${work}/headers.txt" \
            -o "${work}/body.txt" \
            -w '%{http_code}' \
            -X POST "${WORKER_URL}/api/manuscript/intake/advance" \
            -H 'Content-Type: application/json' \
            -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' \
            --data-binary "@${work}/payload.json" || true)"

          echo "status=${status}"
          echo "--- headers ---"
          cat "${work}/headers.txt" || true
          echo "--- body ---"
          cat "${work}/body.txt" || true
          echo

          test "${status}" = "200"
          grep -q '"status":"production_intake"' "${work}/body.txt"
          grep -q '"characterCount":279045' "${work}/body.txt"

      - name: Report diagnostic success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-manuscript-intake-diagnostic\",\"description\":\"Live 279045-character intake passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report diagnostic failure
        if: ${{ failure() }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-manuscript-intake-diagnostic\",\"description\":\"Live manuscript intake failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
