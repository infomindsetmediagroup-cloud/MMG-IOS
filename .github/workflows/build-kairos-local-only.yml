name: Build Kairos Local Only

on:
  push:
    branches:
      - agent/kairos-local-only-execution

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kairos-local-only-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply local-only runtime patch
        env:
          KAIROS_LOCAL_PAYLOAD: 
        run: |
          printf '%s' "${KAIROS_LOCAL_PAYLOAD}" | base64 -d > /tmp/kairos-local.tar.gz
          echo '8dbbcb951be9ed52741d44a3dd1987b96a5a63fc14ad2a4d030df4a5a4f48dd9  /tmp/kairos-local.tar.gz' | sha256sum -c -
          tar -xzf /tmp/kairos-local.tar.gz -C .
      - name: Validate local-only patch
        run: |
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null
          npm run build:webllm
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts
          cd cloudflare/mmg-ios
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null
          npx wrangler deploy --dry-run
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js cloudflare/mmg-ios/wrangler.toml web/kairos-dashboard/scripts/executive-local-inference.js web/kairos-dashboard/scripts/kairos-local-inference.js web/kairos-dashboard/index.html backend-tests/kairos-local-execution.test.ts .github/workflows/deploy-kairos-manuscript-runtime.yml
          git commit -m 'fix: run Kairos generation locally' || exit 0
          git push origin HEAD:agent/kairos-local-only-execution
