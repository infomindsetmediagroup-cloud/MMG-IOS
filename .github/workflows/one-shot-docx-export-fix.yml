name: One-shot DOCX export hotfix

on:
  push:
    branches:
      - hotfix/docx-mammoth-export-resolution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/docx-mammoth-export-resolution
          fetch-depth: 0

      - name: Apply DOCX export-resolution repair
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript_path = Path("web/kairos-dashboard/scripts/manuscript-studio.js")
          manuscript = manuscript_path.read_text()
          manuscript = manuscript.replace(
              'const BUILD = "manuscript-studio-upload-retention-20260730-1";',
              'const BUILD = "manuscript-studio-docx-export-resolution-20260730-1";',
              1,
          )
          old = '''async function extractDocx(file) {
            const mammoth = await importWithFallback(LIBRARIES.mammoth, "DOCX extraction service");
            const api = mammoth.default || mammoth;
            const result = await api.extractRawText({ arrayBuffer: await file.arrayBuffer() });
            const warnings = (result.messages || []).filter(message => message.type === "error");
            if (warnings.length) throw new Error(warnings[0].message || "The DOCX file could not be read.");
            return { text: result.value || "" };
          }
          '''
          new = '''async function extractDocx(file) {
            const mammoth = await importWithFallback(LIBRARIES.mammoth, "DOCX extraction service");
            const extractRawText = resolveMammothExtractRawText(mammoth);
            const result = await extractRawText({ arrayBuffer: await file.arrayBuffer() });
            const warnings = (result.messages || []).filter(message => message.type === "error");
            if (warnings.length) throw new Error(warnings[0].message || "The DOCX file could not be read.");
            return { text: result.value || "" };
          }

          function resolveMammothExtractRawText(moduleNamespace) {
            const candidates = [
              moduleNamespace,
              moduleNamespace?.default,
              moduleNamespace?.default?.default,
            ];
            for (const candidate of candidates) {
              if (typeof candidate?.extractRawText === "function") {
                return candidate.extractRawText.bind(candidate);
              }
            }
            throw new Error("DOCX extraction service loaded without a usable extractRawText function.");
          }
          '''
          if old not in manuscript:
              raise SystemExit("Expected extractDocx implementation was not found")
          manuscript = manuscript.replace(old, new, 1)
          manuscript_path.write_text(manuscript)

          loader_path = Path("web/kairos-dashboard/scripts/legacy-runtime-loader.js")
          loader = loader_path.read_text()
          loader = loader.replace(
              'const BUILD = "kairos-legacy-runtime-loader-20260730-2";',
              'const BUILD = "kairos-legacy-runtime-loader-20260730-3";',
              1,
          )
          loader = loader.replace(
              'const RELEASE = "manuscript-upload-retention-20260730-1";',
              'const RELEASE = "manuscript-docx-export-resolution-20260730-1";',
              1,
          )
          loader_path.write_text(loader)

          index_path = Path("web/kairos-dashboard/index.html")
          index = index_path.read_text()
          import re
          index, count = re.subn(
              r'legacy-runtime-loader\.js\?v=[^"\\s<]+',
              'legacy-runtime-loader.js?v=legacy-docx-export-resolution-20260730-1',
              index,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not cache-bust legacy-runtime-loader.js in index.html")
          index_path.write_text(index)

          Path("tests/manuscript-docx-export-resolution.contract.test.js").write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync(new URL("../web/kairos-dashboard/scripts/manuscript-studio.js", import.meta.url), "utf8");
          const loader = readFileSync(new URL("../web/kairos-dashboard/scripts/legacy-runtime-loader.js", import.meta.url), "utf8");
          const index = readFileSync(new URL("../web/kairos-dashboard/index.html", import.meta.url), "utf8");

          test("DOCX extraction resolves Mammoth named and default export shapes", () => {
            assert.match(source, /manuscript-studio-docx-export-resolution-20260730-1/);
            assert.match(source, /resolveMammothExtractRawText\(mammoth\)/);
            assert.match(source, /moduleNamespace\?\.default/);
            assert.match(source, /moduleNamespace\?\.default\?\.default/);
            assert.match(source, /typeof candidate\?\.extractRawText === "function"/);
            assert.doesNotMatch(source, /const api = mammoth\.default \|\| mammoth/);
            assert.match(loader, /manuscript-docx-export-resolution-20260730-1/);
            assert.match(index, /legacy-runtime-loader\.js\?v=legacy-docx-export-resolution-20260730-1/);
          });
          ''')

          Path("browser-tests/manuscript-studio-docx-export-resolution.spec.mjs").write_text(r'''import { expect, test } from "@playwright/test";
          import { readFileSync } from "node:fs";

          const compatibilitySource = readFileSync(
            new URL("../web/kairos-dashboard/scripts/safari-manuscript-intake-compat.js", import.meta.url),
            "utf8",
          );
          const studioSource = readFileSync(
            new URL("../web/kairos-dashboard/scripts/manuscript-studio.js", import.meta.url),
            "utf8",
          );

          const PROJECT_ID = "manuscript-studio-docx-named-export";
          const ACTIVE_KEY = "kairos.production.active-workspace";
          const EXTRACTED = [
            "This DOCX manuscript fixture proves that Kairos resolves Mammoth's named export.",
            "The default export is intentionally empty, matching the production Safari failure.",
            "The extracted manuscript must be retained, stored, and advanced into production intake.",
          ].join("\n\n");

          function fixtureHTML() {
            return '<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>';
          }

          test("iPhone Safari uploads DOCX when Mammoth exposes extractRawText as a named export", async ({ page }) => {
            const calls = [];

            await page.route("https://cdn.jsdelivr.net/npm/mammoth@1.8.0/+esm", async route => {
              await route.fulfill({
                status: 200,
                headers: {
                  "access-control-allow-origin": "*",
                  "content-type": "application/javascript; charset=utf-8",
                },
                body: `export async function extractRawText() { return { value: ${JSON.stringify(EXTRACTED)}, messages: [] }; }\nexport default {};`,
              });
            });

            await page.route("https://kairos.test/**", async route => {
              const request = route.request();
              const url = new URL(request.url());

              if (request.resourceType() === "document") {
                await route.fulfill({ status: 200, contentType: "text/html", body: fixtureHTML() });
                return;
              }

              if (request.method() === "POST" && url.pathname === `/api/production-registry/manuscripts/${PROJECT_ID}/source`) {
                calls.push(`${request.method()} ${url.pathname}`);
                await route.fulfill({
                  status: 201,
                  contentType: "application/json",
                  body: JSON.stringify({
                    source: {
                      projectId: PROJECT_ID,
                      filename: "Named-Export.docx",
                      name: "Named-Export.docx",
                      size: 128,
                      format: "docx",
                      checksum: "docx-checksum",
                      storedAt: "2026-07-30T10:00:00.000Z",
                    },
                  }),
                });
                return;
              }

              if (request.method() === "POST" && url.pathname === "/api/manuscript/intake/advance") {
                calls.push(`${request.method()} ${url.pathname}`);
                const payload = JSON.parse(request.postData() || "{}");
                expect(payload.manuscript).toBe(EXTRACTED);
                expect(payload.source?.stored).toBe(true);
                await route.fulfill({
                  status: 201,
                  contentType: "application/json",
                  body: JSON.stringify({
                    status: "production_intake",
                    projectID: "publishing-project-docx",
                    intakeID: "intake-docx",
                    customerMessage: "DOCX manuscript advanced into MMG production intake.",
                    manuscript: { characterCount: EXTRACTED.length, wordCount: EXTRACTED.split(/\s+/).length },
                    workflow: { requiredNextActions: ["Complete project setup."] },
                  }),
                });
                return;
              }

              if (request.method() === "PATCH" && url.pathname === `/api/production-registry/projects/${PROJECT_ID}`) {
                calls.push(`${request.method()} ${url.pathname}`);
                await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify({ status: "updated" }) });
                return;
              }

              await route.fulfill({ status: 404, contentType: "application/json", body: JSON.stringify({ error: "not found" }) });
            });

            await page.goto("https://kairos.test/?mode=advanced");
            await page.evaluate(({ key, projectId }) => {
              sessionStorage.setItem(key, JSON.stringify({ workspace: "manuscript-studio", projectId }));
            }, { key: ACTIVE_KEY, projectId: PROJECT_ID });

            await page.addScriptTag({ type: "module", content: compatibilitySource });
            await expect.poll(() => page.evaluate(() => window.KairosSafariManuscriptIntakeCompat?.ready)).toBe(true);
            await page.addScriptTag({ type: "module", content: studioSource });
            await page.locator(".manuscript-launch").tap();
            await expect(page.locator("#manuscript-studio-overlay")).toBeVisible();

            await page.locator("[data-file]").setInputFiles({
              name: "Named-Export.docx",
              mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
              buffer: Buffer.from("fake-docx-container"),
            });

            await expect(page.locator("#ms-body")).toHaveValue(EXTRACTED);
            await expect(page.locator(".manuscript-source")).toContainText("stored and verified");
            await expect(page.locator(".manuscript-error")).toHaveCount(0);

            await page.locator("[data-advance]").tap();
            await expect(page.locator(".manuscript-result")).toContainText("Production intake created");
            expect(calls).toEqual([
              `POST /api/production-registry/manuscripts/${PROJECT_ID}/source`,
              "POST /api/manuscript/intake/advance",
              `PATCH /api/production-registry/projects/${PROJECT_ID}`,
            ]);
          });
          ''')

          Path(".github/workflows/one-shot-docx-export-fix.yml").unlink()
          PY

      - name: Commit repaired runtime and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Mammoth DOCX export shapes"
          git push origin HEAD:hotfix/docx-mammoth-export-resolution
