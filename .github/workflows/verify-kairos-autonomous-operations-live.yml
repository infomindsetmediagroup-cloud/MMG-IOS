name: Verify Kairos Autonomous Operations Live

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-kairos-autonomous-operations-live.yml"
      - "cloudflare/mmg-ios/src/autonomy/**"
      - "cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js"
      - "cloudflare/mmg-ios/wrangler.toml"
  pull_request:
    paths:
      - ".github/workflows/verify-kairos-autonomous-operations-live.yml"
      - "cloudflare/mmg-ios/src/autonomy/**"
      - "cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js"
      - "cloudflare/mmg-ios/wrangler.toml"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: verify-kairos-autonomous-operations-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production autonomy boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      API_BUILD: kairos-autonomy-api-20260802-5-complete-operations
      API_V4_BUILD: kairos-autonomy-api-20260802-4-business-state-persistence
      CYCLE_BUILD: kairos-autonomous-operations-cycle-20260802-1
      PRIORITIZER_BUILD: kairos-business-prioritizer-20260802-1
      ORCHESTRATOR_BUILD: kairos-business-orchestrator-20260802-1
      SCHEDULER_BUILD: kairos-autonomy-scheduler-20260802-2-complete-operations
      AUTONOMY_TOKEN: ${{ secrets.KAIROS_AUTONOMY_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATUS_CONTEXT: kairos-autonomous-operations-live

    steps:
      - name: Mark pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:process.env.STATUS_CONTEXT,description:"Verifying live autonomous operations",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate verification contract
        run: |
          set -euo pipefail
          node --check cloudflare/mmg-ios/src/autonomy/kairos-autonomy-api-v5.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-autonomous-operations-cycle-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-business-prioritizer-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-business-orchestrator-v1.js
          node --check cloudflare/mmg-ios/src/autonomy/kairos-autonomy-scheduler-v2.js
          grep -Fq "${API_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-autonomy-api-v5.js
          grep -Fq "${CYCLE_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-autonomous-operations-cycle-v1.js
          grep -Fq "${PRIORITIZER_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-business-prioritizer-v1.js
          grep -Fq "${ORCHESTRATOR_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-business-orchestrator-v1.js
          grep -Fq "${SCHEDULER_BUILD}" cloudflare/mmg-ios/src/autonomy/kairos-autonomy-scheduler-v2.js

      - name: Verify public production boundary and active builds
        id: public
        run: |
          set -euo pipefail
          headers_raw="${RUNNER_TEMP}/autonomy-unauthenticated.headers.raw"
          headers="${RUNNER_TEMP}/autonomy-unauthenticated.headers"
          body="${RUNNER_TEMP}/autonomy-unauthenticated.json"
          status="$(curl --silent --show-error --max-time 45 \
            -D "${headers_raw}" \
            "${WORKER_URL}/api/autonomy/status?verification=${GITHUB_SHA}" \
            -o "${body}" \
            -w '%{http_code}')"
          tr -d '\r' < "${headers_raw}" > "${headers}"

          cat "${headers}"
          cat "${body}"
          grep -Fxiq "x-kairos-autonomy-api-build: ${API_BUILD}" "${headers}"
          grep -Fxiq "x-kairos-autonomy-api-v4-build: ${API_V4_BUILD}" "${headers}"
          grep -Fxiq "x-kairos-autonomous-operations-cycle-build: ${CYCLE_BUILD}" "${headers}"
          grep -Fxiq "x-kairos-business-prioritizer-build: ${PRIORITIZER_BUILD}" "${headers}"
          grep -Fxiq "x-kairos-business-orchestrator-build: ${ORCHESTRATOR_BUILD}" "${headers}"
          grep -Fxiq "x-kairos-autonomy-scheduler-build: ${SCHEDULER_BUILD}" "${headers}"
          grep -Fxiq 'x-kairos-inference-provider: browser-webgpu' "${headers}"
          grep -Fxiq 'x-kairos-external-provider: disabled' "${headers}"
          grep -Fxiq 'x-kairos-openai-calls: disabled' "${headers}"
          grep -Fq '"ok":false' "${body}"
          grep -Fq "\"build\":\"${API_BUILD}\"" "${body}"

          if [ "${status}" = "401" ] && grep -Fq '"error":{"code":"AUTHENTICATION_REQUIRED"' "${body}"; then
            auth_state="configured"
          elif [ "${status}" = "503" ] && grep -Fq '"error":{"code":"AUTONOMY_API_NOT_CONFIGURED"' "${body}"; then
            auth_state="unconfigured"
          else
            echo "Unexpected public autonomy response: HTTP ${status}" >&2
            exit 1
          fi
          echo "auth_state=${auth_state}" >> "${GITHUB_OUTPUT}"

      - name: Provision missing Worker authentication boundary
        id: provision
        if: github.event_name == 'push' && steps.public.outputs.auth_state == 'unconfigured'
        working-directory: cloudflare/mmg-ios
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          token_file="${RUNNER_TEMP}/kairos-autonomy-verification-token"
          umask 077
          printf '%s' "${token}" > "${token_file}"
          echo "VERIFICATION_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"

          npm install --ignore-scripts --no-audit --no-fund
          printf '%s' "${token}" | npx wrangler secret put KAIROS_AUTONOMY_API_TOKEN

          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --max-time 30 \
              "${WORKER_URL}/api/autonomy/status?auth-provision=${GITHUB_SHA}-${attempt}" \
              -o "${RUNNER_TEMP}/auth-provision.json" \
              -w '%{http_code}' || true)"
            if [ "${status}" = "401" ]; then
              echo "provisioned=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 5
          done
          cat "${RUNNER_TEMP}/auth-provision.json" || true
          exit 1

      - name: Verify authenticated readiness and execute one governed manual cycle
        id: authenticated
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/autonomy-live-summary.json"
          token="${AUTONOMY_TOKEN:-}"
          if [ -z "${token}" ] && [ -n "${VERIFICATION_TOKEN_FILE:-}" ] && [ -f "${VERIFICATION_TOKEN_FILE}" ]; then
            token="$(cat "${VERIFICATION_TOKEN_FILE}")"
          fi
          if [ -z "${token}" ]; then
            node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({authenticated:false,reason:"No verification token is available to this workflow run."}, null, 2))' "${summary}"
            echo "authenticated=false" >> "${GITHUB_OUTPUT}"
            cat "${summary}"
            exit 0
          fi
          echo "::add-mask::${token}"

          status_headers_raw="${RUNNER_TEMP}/autonomy-authenticated-status.headers.raw"
          status_headers="${RUNNER_TEMP}/autonomy-authenticated-status.headers"
          status_body="${RUNNER_TEMP}/autonomy-authenticated-status.json"
          status_code="$(curl --silent --show-error --max-time 45 \
            -D "${status_headers_raw}" \
            -H "Authorization: Bearer ${token}" \
            "${WORKER_URL}/api/autonomy/status?verification=${GITHUB_SHA}" \
            -o "${status_body}" \
            -w '%{http_code}')"
          tr -d '\r' < "${status_headers_raw}" > "${status_headers}"
          test "${status_code}" = "200"

          STATUS_BODY="${status_body}" API_BUILD="${API_BUILD}" CYCLE_BUILD="${CYCLE_BUILD}" PRIORITIZER_BUILD="${PRIORITIZER_BUILD}" ORCHESTRATOR_BUILD="${ORCHESTRATOR_BUILD}" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.STATUS_BODY, "utf8"));
          if (value?.ok !== true || value?.build !== process.env.API_BUILD) throw new Error("Authenticated status build mismatch.");
          if (value?.autonomousOperations?.ready !== true) throw new Error("Autonomous operations are not ready.");
          if (value?.autonomousOperations?.cycleBuild !== process.env.CYCLE_BUILD) throw new Error("Cycle build mismatch.");
          if (value?.autonomousOperations?.prioritizerBuild !== process.env.PRIORITIZER_BUILD) throw new Error("Prioritizer build mismatch.");
          if (value?.autonomousOperations?.orchestratorBuild !== process.env.ORCHESTRATOR_BUILD) throw new Error("Orchestrator build mismatch.");
          const observation = value?.businessObservation || {};
          for (const key of ["manualPersistenceEnabled", "scheduledCollectionEnabled", "scheduledPersistenceEnabled", "prioritizationEnabled", "orchestrationEnabled", "certifiedExecutionEnabled", "approvalBoundaryEnabled"]) {
            if (observation[key] !== true) throw new Error(`${key} is not enabled.`);
          }
          if (observation.externalMutationEnabled !== false) throw new Error("External mutation must remain disabled.");
          NODE

          cycle_headers_raw="${RUNNER_TEMP}/autonomy-manual-cycle.headers.raw"
          cycle_headers="${RUNNER_TEMP}/autonomy-manual-cycle.headers"
          cycle_body="${RUNNER_TEMP}/autonomy-manual-cycle.json"
          cycle_code="$(curl --silent --show-error --max-time 120 \
            -D "${cycle_headers_raw}" \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            --data '{"tenantId":"mmg"}' \
            "${WORKER_URL}/api/autonomy/business-state/collect?verification=${GITHUB_SHA}" \
            -o "${cycle_body}" \
            -w '%{http_code}')"
          tr -d '\r' < "${cycle_headers_raw}" > "${cycle_headers}"
          test "${cycle_code}" = "200" -o "${cycle_code}" = "503"

          CYCLE_BODY="${cycle_body}" API_BUILD="${API_BUILD}" CYCLE_BUILD="${CYCLE_BUILD}" node <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.env.CYCLE_BODY, "utf8"));
          if (value?.build !== process.env.API_BUILD) throw new Error("Manual cycle API build mismatch.");
          if (value?.operations?.build !== process.env.CYCLE_BUILD) throw new Error("Manual cycle did not execute the complete operations engine.");
          if (value?.operations?.activation?.operationsEnabled !== true) throw new Error("Operations activation is not enabled.");
          if (value?.operations?.activation?.activationGateMatched !== true) throw new Error("Operations activation gate is not matched.");
          if (value?.operations?.activation?.killSwitchEnabled !== true) throw new Error("Kill-switch authorization is not enabled.");
          if (value?.operations?.persistence?.ok !== true) throw new Error("Manual cycle did not persist its business-state snapshot.");
          if (!value?.operations?.plan?.planId) throw new Error("Manual cycle did not produce a priority plan.");
          if (!value?.operations?.orchestration || typeof value.operations.orchestration.ok !== "boolean") throw new Error("Manual cycle did not produce an orchestration result.");
          NODE

          STATUS_BODY="${status_body}" CYCLE_BODY="${cycle_body}" SUMMARY="${summary}" node <<'NODE'
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync(process.env.STATUS_BODY, "utf8"));
          const cycle = JSON.parse(fs.readFileSync(process.env.CYCLE_BODY, "utf8"));
          fs.writeFileSync(process.env.SUMMARY, JSON.stringify({
            authenticated: true,
            ready: status.autonomousOperations.ready,
            snapshotId: cycle.operations.snapshotId,
            planId: cycle.operations.plan.planId,
            cycleStatus: cycle.operations.status,
            persistence: cycle.operations.persistence.disposition,
            taskCount: cycle.operations.plan.taskCount,
            completedCount: cycle.operations.orchestration.counts.completed,
            blockedCount: cycle.operations.orchestration.counts.blocked,
            failedCount: cycle.operations.orchestration.counts.failed,
          }, null, 2));
          NODE
          echo "authenticated=true" >> "${GITHUB_OUTPUT}"
          cat "${summary}"

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-autonomous-operations-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/autonomy-unauthenticated.headers
            ${{ runner.temp }}/autonomy-unauthenticated.json
            ${{ runner.temp }}/autonomy-authenticated-status.headers
            ${{ runner.temp }}/autonomy-authenticated-status.json
            ${{ runner.temp }}/autonomy-manual-cycle.headers
            ${{ runner.temp }}/autonomy-manual-cycle.json
            ${{ runner.temp }}/autonomy-live-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          AUTHENTICATED: ${{ steps.authenticated.outputs.authenticated }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ] && [ "${AUTHENTICATED:-false}" = "true" ]; then
            state="success"
            description="Autonomous operations live and cycle verified"
          elif [ "${JOB_STATUS}" = "success" ]; then
            state="success"
            description="Autonomy builds live; authenticated cycle unavailable"
          else
            state="failure"
            description="Live autonomous operations verification failed"
          fi
          payload="$(STATE="${state}" DESCRIPTION="${description}" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.STATUS_CONTEXT,description:process.env.DESCRIPTION,target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
