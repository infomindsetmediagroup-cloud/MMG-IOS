name: Run Kairos Growth Job Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/start-kairos-production-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: run-kairos-growth-job-once
  cancel-in-progress: false

jobs:
  run-growth-job:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      EXPECTED_BUILD: kairos-operational-execution-20260730-2-approval-recovery
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report job pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-growth-job\",\"description\":\"Starting one governed quota-independent Kairos growth job\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Start and verify governed growth job
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/kairos-growth-job"
          mkdir -p "${workdir}"

          readiness="${workdir}/readiness.json"
          readiness_code="$(curl --silent --show-error --max-time 30 \
            "${WORKER_URL}/api/operational-readiness?growth_job=${GITHUB_RUN_ID}" \
            -o "${readiness}" -w '%{http_code}' || true)"
          echo "Readiness HTTP ${readiness_code}"
          cat "${readiness}" || true
          [ "${readiness_code}" = "200" ] || exit 1
          jq -e --arg build "${EXPECTED_BUILD}" '
            .status == "ready"
            and .objectiveSubmission == "ready"
            and .build == $build
            and .automaticPublicationAllowed == false
            and .commerceMutationAllowed == false
          ' "${readiness}" >/dev/null

          launch="${workdir}/launch.json"
          objective="Create a draft-only 30-day Mindset Media Group growth experiment plan focused on improving TikTok-to-Shopify conversion. Define the audience hypothesis, content pillars, three measurable experiments, weekly KPIs, evidence requirements, risk controls, and an approval-gated execution sequence. Do not publish content, change pricing, mutate Shopify, spend funds, contact customers, or delete data."
          payload="$(jq -cn --arg action "growth-plan" --arg objective "${objective}" '{action:$action, objective:$objective}')"

          launched=false
          for launch_attempt in $(seq 1 6); do
            launch_code="$(curl --silent --show-error --max-time 60 -X POST \
              -H 'Content-Type: application/json' \
              -H 'X-MMG-Job-Source: owner-chat-test' \
              --data "${payload}" \
              "${WORKER_URL}/api/hub/run?launch_attempt=${launch_attempt}" \
              -o "${launch}" -w '%{http_code}' || true)"
            echo "Launch attempt ${launch_attempt}: HTTP ${launch_code}"
            cat "${launch}" || true
            if [ "${launch_code}" = "202" ] && jq -e '.status == "accepted"' "${launch}" >/dev/null 2>&1; then
              launched=true
              break
            fi
            if [ "${launch_code}" = "503" ] \
              && jq -e '.error.retriable == true and (.error.message | contains("Durable Object reset"))' "${launch}" >/dev/null 2>&1; then
              echo "Transient Durable Object deployment reset detected; retrying the exact launch after stabilization."
              sleep 10
              continue
            fi
            echo "Launch failed with a non-approved or non-transient response."
            exit 1
          done
          [ "${launched}" = "true" ] || { echo "Growth job launch did not recover from the bounded reset window."; exit 1; }

          jq -e '
            (.runtimeProjectId | startswith("kproject_browser_"))
            and (.agentProjectId | startswith("kproject-browser-"))
            and (.workflowInstanceId | type == "string" and length > 5)
            and .automaticPublicationAllowed == false
            and .commerceMutationAllowed == false
          ' "${launch}" >/dev/null

          runtime_id="$(jq -r '.runtimeProjectId' "${launch}")"
          agent_id="$(jq -r '.agentProjectId' "${launch}")"
          instance_id="$(jq -r '.workflowInstanceId' "${launch}")"
          echo "RUNTIME_ID=${runtime_id}" >> "${GITHUB_ENV}"
          echo "AGENT_ID=${agent_id}" >> "${GITHUB_ENV}"
          echo "INSTANCE_ID=${instance_id}" >> "${GITHUB_ENV}"

          state="${workdir}/state.json"
          projection="${workdir}/projection.json"
          for attempt in $(seq 1 60); do
            state_code="$(curl --silent --show-error --max-time 30 \
              "${WORKER_URL}/api/kairos/project-agents/${agent_id}/state?growth_job=${GITHUB_RUN_ID}&attempt=${attempt}" \
              -o "${state}" -w '%{http_code}' || true)"
            projection_code="$(curl --silent --show-error --max-time 30 \
              "${WORKER_URL}/api/workflows?growth_job=${GITHUB_RUN_ID}&attempt=${attempt}" \
              -o "${projection}" -w '%{http_code}' || true)"

            if [ "${state_code}" = "200" ] \
              && [ "${projection_code}" = "200" ] \
              && jq -e --arg iid "${instance_id}" '
                .state.activeWorkflow.instanceId == $iid
                and .state.activeWorkflow.status == "waiting_for_approval"
                and .state.pendingApproval.workflowInstanceId == $iid
                and .state.pendingApproval.type == "FOUNDATION_APPROVAL"
              ' "${state}" >/dev/null 2>&1 \
              && jq -e --arg rid "${runtime_id}" --arg iid "${instance_id}" '
                .workflows
                | map(select((.projectId == $rid) or (.id == $rid)))[0]
                | .workflowInstanceId == $iid
                  and .state == "pending"
                  and .actionRequired == "approve-foundation"
                  and .canApprove == true
                  and .automaticPublicationAllowed == false
                  and .commerceMutationAllowed == false
              ' "${projection}" >/dev/null 2>&1; then
              echo "Kairos growth job durably reached its approval gate."
              cat "${state}"
              cat "${projection}"
              {
                echo "## Kairos growth job"
                echo "- Runtime project: ${runtime_id}"
                echo "- Project Agent: ${agent_id}"
                echo "- Foundation Workflow: ${instance_id}"
                echo "- Status: waiting_for_approval"
                echo "- Required action: approve-foundation"
                echo "- Automatic publication: disabled"
                echo "- Commerce mutation: disabled"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            echo "Verification attempt ${attempt}: agent ${state_code}; projection ${projection_code}"
            cat "${state}" || true
            sleep 5
          done

          echo "Growth job did not reach the durable approval gate."
          exit 1

      - name: Report job success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-growth-job\",\"description\":\"Kairos growth job reached its durable approval gate\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report job failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-growth-job\",\"description\":\"Kairos growth job failed or did not reach approval\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
