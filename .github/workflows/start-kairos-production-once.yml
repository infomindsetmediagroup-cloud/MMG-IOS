name: Apply Kairos Operational Approval Hotfix Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/start-kairos-production-once.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: patch-kairos-operational-approval-idempotency
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: hotfix/kairos-operational-approval-idempotency
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report patch pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-operational-approval-hotfix\",\"description\":\"Patching idempotent operational approval recovery\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply scoped runtime patch and regression test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("cloudflare/mmg-ios/src/kairos-production-entry-operational-execution-v1.js")
          source = source_path.read_text()

          old_build = 'export const KAIROS_OPERATIONAL_EXECUTION_BUILD = "kairos-operational-execution-20260729-1";'
          new_build = 'export const KAIROS_OPERATIONAL_EXECUTION_BUILD = "kairos-operational-execution-20260730-2-approval-recovery";'
          if old_build not in source:
              raise SystemExit("Expected operational build marker was not found.")
          source = source.replace(old_build, new_build, 1)

          old = '''async function approveFoundation(env, runtimeProject, agent, agentProjectId, operator) {
            const agentState = await agent.getProjectState();
            const instanceId = agentState?.pendingApproval?.workflowInstanceId || agentState?.activeWorkflow?.instanceId;
            if (!instanceId) throw runtimeError("No pending foundation approval was found.", "FOUNDATION_APPROVAL_NOT_FOUND", 409);
            await agent.approveFoundationWorkflow(instanceId, { approvedBy: operator, reason: "Approved in the Kairos Executive OS." });

            try {'''

          new = '''async function approveFoundation(env, runtimeProject, agent, agentProjectId, operator) {
            const agentState = await agent.getProjectState();
            const instanceId = agentState?.pendingApproval?.workflowInstanceId || agentState?.activeWorkflow?.instanceId;
            const foundationStatus = clean(agentState?.activeWorkflow?.status, 80).toLowerCase();
            const foundationAlreadyCompleted = foundationStatus === "completed" && !agentState?.pendingApproval;
            if (!instanceId) throw runtimeError("No foundation workflow was found.", "FOUNDATION_APPROVAL_NOT_FOUND", 409);
            if (!foundationAlreadyCompleted) {
              await agent.approveFoundationWorkflow(instanceId, { approvedBy: operator, reason: "Approved in the Kairos Executive OS." });
            }

            try {'''

          if old not in source:
              raise SystemExit("Expected approveFoundation block was not found.")
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path("backend-tests/kairos-operational-approval-idempotency.test.ts")
          test_path.write_text('''import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";

          const runtime = readFileSync(
            "cloudflare/mmg-ios/src/kairos-production-entry-operational-execution-v1.js",
            "utf8",
          );

          describe("Kairos operational approval recovery", () => {
            it("synchronizes a completed foundation without re-sending a finite Workflow approval event", () => {
              expect(runtime).toContain(
                'const foundationAlreadyCompleted = foundationStatus === "completed" && !agentState?.pendingApproval;',
              );
              expect(runtime).toContain("if (!foundationAlreadyCompleted) {");
              expect(runtime).toContain("await agent.approveFoundationWorkflow(instanceId");
              expect(runtime).toContain("const source = await createAndStoreAuthoritativeSource");
              expect(runtime).toContain("kairos-operational-execution-20260730-2-approval-recovery");
            });
          });
          ''')
          PY

          git diff --check
          git diff -- cloudflare/mmg-ios/src/kairos-production-entry-operational-execution-v1.js backend-tests/kairos-operational-approval-idempotency.test.ts

      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Run focused regression test
        run: npx vitest run backend-tests/kairos-operational-approval-idempotency.test.ts backend-tests/kairos-project-agent-foundation.test.ts

      - name: Commit hotfix branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/mmg-ios/src/kairos-production-entry-operational-execution-v1.js \
            backend-tests/kairos-operational-approval-idempotency.test.ts
          git diff --cached --quiet && { echo "No hotfix changes were produced."; exit 1; }
          git commit -m "fix: recover completed operational approvals idempotently"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Report patch success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-operational-approval-hotfix\",\"description\":\"Hotfix branch patched and focused regression tests passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report patch failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-operational-approval-hotfix\",\"description\":\"Operational approval hotfix or regression validation failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
