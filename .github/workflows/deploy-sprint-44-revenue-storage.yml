name: Deploy Kairos Browser and Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'backend-tests/**'
      - 'tests/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-browser-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report deployment pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-browser-runtime\",\"description\":\"Deploying operational Kairos browser and runtime\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out authorized main commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate production bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy production Worker and browser assets
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify live clean Executive OS and isolated advanced runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            html="${RUNNER_TEMP}/kairos.html"
            safari="${RUNNER_TEMP}/safari.js"
            executive="${RUNNER_TEMP}/executive.js"
            legacy="${RUNNER_TEMP}/legacy.js"
            health="${RUNNER_TEMP}/health.json"
            readiness="${RUNNER_TEMP}/readiness.json"
            workflows="${RUNNER_TEMP}/workflows.json"
            brief="${RUNNER_TEMP}/brief.json"

            html_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${html}" -w '%{http_code}' || true)"
            safari_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/safari-manuscript-intake-compat.js?v=safari-intake-fix-20260729-9&release=${GITHUB_SHA}&attempt=${attempt}" -o "${safari}" -w '%{http_code}' || true)"
            executive_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-os.js?v=browser-finish-20260729-5&release=${GITHUB_SHA}&attempt=${attempt}" -o "${executive}" -w '%{http_code}' || true)"
            legacy_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/legacy-runtime-loader.js?v=legacy-isolated-20260729-1&release=${GITHUB_SHA}&attempt=${attempt}" -o "${legacy}" -w '%{http_code}' || true)"
            health_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/health?release=${GITHUB_SHA}&attempt=${attempt}" -o "${health}" -w '%{http_code}' || true)"
            readiness_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/operational-readiness?release=${GITHUB_SHA}&attempt=${attempt}" -o "${readiness}" -w '%{http_code}' || true)"
            workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?release=${GITHUB_SHA}&attempt=${attempt}" -o "${workflows}" -w '%{http_code}' || true)"
            brief_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/executive-briefing/latest?release=${GITHUB_SHA}&attempt=${attempt}" -o "${brief}" -w '%{http_code}' || true)"

            module_count="$(grep -o '<script type="module"' "${html}" | wc -l | tr -d ' ')"

            if [ "${html_status}" = "200" ] \
              && grep -q 'Kairos Executive Operating System' "${html}" \
              && grep -q 'kairos-executive-clean-boot-20260729-1' "${html}" \
              && grep -q 'safari-intake-fix-20260729-9' "${html}" \
              && grep -q 'legacy-isolated-20260729-1' "${html}" \
              && [ "${module_count}" = "2" ] \
              && ! grep -q 'command-hub.js' "${html}" \
              && ! grep -q 'manuscript-studio.js' "${html}" \
              && [ "${safari_status}" = "200" ] \
              && grep -q 'safari-manuscript-intake-compat-20260729-9' "${safari}" \
              && grep -q 'browser-finish-20260729-5' "${safari}" \
              && grep -q 'ADVANCED_MODE' "${safari}" \
              && grep -q 'installGovernedFetchTimeout' "${safari}" \
              && [ "${executive_status}" = "200" ] \
              && grep -q 'kairos-abos-v2-browser-finish-20260729-5' "${executive}" \
              && grep -q 'refreshing: false' "${executive}" \
              && grep -q 'openAdvancedWorkspace' "${executive}" \
              && grep -q 'renderEmergencyRecovery' "${executive}" \
              && grep -q 'Promise.race' "${executive}" \
              && grep -q 'API_GET_TIMEOUT_MS = 12000' "${executive}" \
              && [ "${legacy_status}" = "200" ] \
              && grep -q 'kairos-legacy-runtime-loader-20260729-1' "${legacy}" \
              && grep -q 'if (advancedMode) loadLegacyRuntime()' "${legacy}" \
              && grep -q 'command-hub.js' "${legacy}" \
              && grep -q 'manuscript-studio.js' "${legacy}" \
              && grep -q 'production-workspace-controller.js' "${legacy}" \
              && grep -q 'shopify-page-compiler.js' "${legacy}" \
              && [ "${health_status}" = "200" ] \
              && grep -q '"status":"ready"' "${health}" \
              && [ "${readiness_status}" = "200" ] \
              && grep -q '"status":"ready"' "${readiness}" \
              && grep -q '"objectiveSubmission":"ready"' "${readiness}" \
              && grep -q '"sourceGeneration":"ready"' "${readiness}" \
              && grep -q '"productionExecution":"ready"' "${readiness}" \
              && grep -q '"approvalPolicy":"explicit"' "${readiness}" \
              && [ "${workflows_status}" = "200" ] \
              && grep -q '"status":"ready"' "${workflows}" \
              && grep -q '"workflows":\[' "${workflows}" \
              && grep -q '"executionSource":"kairos-project-agent-workflows"' "${workflows}" \
              && { [ "${brief_status}" = "200" ] || [ "${brief_status}" = "404" ]; }; then
              echo "Live clean Executive OS and isolated advanced runtime verified."
              cat "${health}"
              cat "${readiness}"
              cat "${workflows}"
              cat "${brief}" || true
              exit 0
            fi
            sleep 5
          done

          echo "HTML status: ${html_status}"
          echo "Homepage module count: ${module_count}"
          echo "Safari module status: ${safari_status}"
          echo "Executive OS module status: ${executive_status}"
          echo "Legacy runtime loader status: ${legacy_status}"
          echo "Health status: ${health_status}"
          echo "Operational readiness status: ${readiness_status}"
          echo "Workflows status: ${workflows_status}"
          echo "Brief status: ${brief_status}"
          cat "${html}" || true
          cat "${safari}" || true
          cat "${executive}" || true
          cat "${legacy}" || true
          cat "${health}" || true
          cat "${readiness}" || true
          cat "${workflows}" || true
          cat "${brief}" || true
          exit 1

      - name: Report deployment success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-browser-runtime\",\"description\":\"Clean Executive OS and isolated runtime deployed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-browser-runtime\",\"description\":\"Kairos operational browser/runtime deployment failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
