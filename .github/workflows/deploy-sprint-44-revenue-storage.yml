name: Validate Kairos Browser and Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'cloudflare/mmg-ios/test/**'
      - 'backend-tests/**'
      - 'browser-tests/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'cloudflare/mmg-ios/test/**'
      - 'backend-tests/**'
      - 'browser-tests/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-kairos-browser-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate browser and manuscript runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build same-origin WebLLM runtime
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js

      - name: Validate browser runtime and manuscript contracts
        run: |
          node --check web/kairos-dashboard/scripts/manuscript-direct-open-controller.js
          node --check web/kairos-dashboard/scripts/manuscript-pipeline-orchestrator.js
          node --check web/kairos-dashboard/scripts/manuscript-stage-handoff-controller.js
          node --check web/kairos-dashboard/scripts/manuscript-production-flow-bootstrap.js
          node --check web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node --check web/kairos-dashboard/scripts/manuscript-studio.js
          node --check web/kairos-dashboard/scripts/manuscript-project-setup.js
          node --check web/kairos-dashboard/scripts/manuscript-post-intake-guard.js
          node --check web/kairos-dashboard/scripts/production-workspace-controller.js
          node --check web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
          node --check web/kairos-dashboard/scripts/kairos-state-fetch.js
          node --check web/kairos-dashboard/scripts/kairos-state-fetch-install.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-canonical-publishing-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js
          node --test tests/kairos-operational-execution-bridge.contract.test.js
          node --test tests/manuscript-production-flow-guard.contract.test.js
          node cloudflare/mmg-ios/scripts/validate-manuscript-large-intake.mjs
          npm run validate:manuscript-activation
          grep -q 'main = "src/kairos-production-entry-canonical-publishing-v1.js"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_LOCAL_INFERENCE_ENABLED = "true"' cloudflare/mmg-ios/wrangler.toml
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Verify manuscript pipeline in WebKit
        run: |
          npx playwright test \
            browser-tests/manuscript-direct-open.spec.mjs \
            browser-tests/manuscript-continuation.spec.mjs \
            browser-tests/manuscript-pipeline-orchestrator.spec.mjs \
            browser-tests/manuscript-post-intake-stability.spec.mjs \
            browser-tests/manuscript-project-setup.spec.mjs \
            browser-tests/manuscript-editorial-workbench.spec.mjs \
            browser-tests/manuscript-stage-handoff.spec.mjs \
            browser-tests/manuscript-studio-safari-upload.spec.mjs \
            browser-tests/manuscript-studio-direct-chunk.spec.mjs \
            --project=webkit \
            --workers=1

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate production Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Confirm canonical deployment ownership
        run: |
          grep -Fq 'name: Deploy Canonical Kairos Worker' .github/workflows/deploy-kairos-canonical-worker.yml
          echo 'Validation complete. Production deployment is owned by deploy-kairos-canonical-worker.yml.'
