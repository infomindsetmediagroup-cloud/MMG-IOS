name: Deploy Kairos Browser and Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'cloudflare/mmg-ios/test/**'
      - 'backend-tests/**'
      - 'browser-tests/**'
      - 'tests/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-browser-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Report deployment pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-browser-runtime\",\"description\":\"Deploying direct Studio chunk runtime\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out authorized main commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build same-origin WebLLM runtime
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js

      - name: Validate five-center dashboard and direct Studio chunk contracts
        run: |
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-registry-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-source-v1.js
          node --check web/kairos-dashboard/scripts/safari-manuscript-intake-compat.js
          node --check web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node --check web/kairos-dashboard/scripts/kairos-runtime-loader.js
          node --check web/kairos-dashboard/scripts/command-hub.js
          node --check web/kairos-dashboard/scripts/manuscript-studio.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-source-forwarding.test.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-chunked-upload.test.js
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts
          node cloudflare/mmg-ios/scripts/validate-manuscript-large-intake.mjs
          node --test tests/kairos-operational-execution-bridge.contract.test.js
          node --check browser-tests/manuscript-studio-direct-chunk.spec.mjs
          grep -q 'kairos-five-center-dashboard-restored-20260730-1' web/kairos-dashboard/index.html
          grep -q 'five-center-dashboard-direct-studio-chunks-20260730-4' web/kairos-dashboard/index.html
          grep -q 'legacy-runtime-loader.js' web/kairos-dashboard/index.html
          ! grep -q 'executive-local-inference.js' web/kairos-dashboard/index.html
          ! grep -q 'kairos-runtime-loader.js' web/kairos-dashboard/index.html
          grep -q 'const ASSET_RELEASE = "five-center-dashboard-direct-studio-chunks-20260730-4"' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          grep -q 'commandHubMode' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          grep -q 'command-hub.js' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node -e 'const fs=require("fs");const s=fs.readFileSync("web/kairos-dashboard/scripts/legacy-runtime-loader.js","utf8");const a=s.match(/const SCRIPT_FILES = \[([\s\S]*?)\];/)?.[1]||"";if(a.includes("manuscript-docx-upload-hotfix.js"))process.exit(1);if(!a.includes("manuscript-studio.js"))process.exit(1);'
          grep -q 'manuscript-studio-direct-chunks-20260730-4' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'chunkedSourceUpload: true' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'multipartSourceUpload: false' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'FILE_CHUNK_BYTES = 512 \* 1024' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'TEXT_CHUNK_BYTES = 128 \* 1024' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'sourcePath(projectId, "session")' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'sourcePath(projectId, "commit")' web/kairos-dashboard/scripts/manuscript-studio.js
          ! grep -q 'new FormData' web/kairos-dashboard/scripts/manuscript-studio.js
          ! grep -q 'executive-local-inference.js' web/kairos-dashboard/scripts/kairos-runtime-loader.js
          grep -q 'main = "src/kairos-production-entry-local-canonical-v1.js"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_NO_COST_MODE = "true"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_LOCAL_INFERENCE_ENABLED = "true"' cloudflare/mmg-ios/wrangler.toml
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js
          grep -q 'OPENAI_API_KEY.*return ""' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          grep -q 'kairos-local-readiness-sentinel-not-a-provider-key' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          ! grep -q 'cdn.jsdelivr.net' web/kairos-dashboard/scripts/executive-local-inference.js
          ! grep -q 'esm.run' web/kairos-dashboard/scripts/executive-local-inference.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Verify direct Studio forced-502 recovery in WebKit
        run: npx playwright test browser-tests/manuscript-studio-direct-chunk.spec.mjs --project=webkit

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate production Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy production Worker and browser assets
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify live five-center dashboard and direct Studio chunk runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            root="${RUNNER_TEMP}/root.html"
            safari="${RUNNER_TEMP}/safari.js"
            loader="${RUNNER_TEMP}/legacy-loader.js"
            compatibility_loader="${RUNNER_TEMP}/runtime-loader.js"
            command="${RUNNER_TEMP}/command-hub.js"
            studio="${RUNNER_TEMP}/manuscript-studio.js"
            bridge="${RUNNER_TEMP}/local-bridge.js"
            inference="${RUNNER_TEMP}/local-inference.js"
            bundle="${RUNNER_TEMP}/webllm-bundle.js"
            readiness="${RUNNER_TEMP}/readiness.json"
            workflows="${RUNNER_TEMP}/workflows.json"
            api_denial="${RUNNER_TEMP}/api-denial.json"
            manuscript_denial="${RUNNER_TEMP}/manuscript-denial.json"
            revenue_denial="${RUNNER_TEMP}/revenue-denial.json"
            shopify_denial="${RUNNER_TEMP}/shopify-denial.json"
            canonical_headers="${RUNNER_TEMP}/canonical-headers.txt"

            root_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${root}" -w '%{http_code}' || true)"
            safari_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/safari-manuscript-intake-compat.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${safari}" -w '%{http_code}' || true)"
            loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/legacy-runtime-loader.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${loader}" -w '%{http_code}' || true)"
            compatibility_loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-runtime-loader.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${compatibility_loader}" -w '%{http_code}' || true)"
            command_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/command-hub.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${command}" -w '%{http_code}' || true)"
            studio_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/manuscript-studio.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${studio}" -w '%{http_code}' || true)"
            bridge_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-local-inference.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${bridge}" -w '%{http_code}' || true)"
            inference_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-local-inference-same-origin.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${inference}" -w '%{http_code}' || true)"
            bundle_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/vendor/webllm-bundle.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${bundle}" -w '%{http_code}' || true)"
            readiness_status="$(curl --silent --show-error --max-time 20 -D "${canonical_headers}" "${WORKER_URL}/api/operational-readiness?release=${GITHUB_SHA}&attempt=${attempt}" -o "${readiness}" -w '%{http_code}' || true)"
            workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?release=${GITHUB_SHA}&attempt=${attempt}" -o "${workflows}" -w '%{http_code}' || true)"
            api_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${api_denial}" -w '%{http_code}' || true)"
            manuscript_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/production-registry/manuscripts/test-project-12345678/generation-job" -H 'Content-Type: application/json' --data '{}' -o "${manuscript_denial}" -w '%{http_code}' || true)"
            revenue_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos/revenue/execute-content-batch" -H 'Content-Type: application/json' --data '{}' -o "${revenue_denial}" -w '%{http_code}' || true)"
            shopify_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/shopify/page-shell/publish" -H 'Content-Type: application/json' --data '{}' -o "${shopify_denial}" -w '%{http_code}' || true)"

            module_count="$(grep -o '<script type="module"' "${root}" | wc -l | tr -d ' ')"
            parent_center_count="$(grep -o 'id: "\(knowledge\|content\|business\|customers\|operations\)"' "${command}" | wc -l | tr -d ' ')"
            active_scripts="$(node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");process.stdout.write(s.match(/const SCRIPT_FILES = \[([\s\S]*?)\];/)?.[1]||"")' "${loader}")"

            if [ "${root_status}" = "200" ] \
              && [ "${module_count}" = "2" ] \
              && grep -q 'kairos-five-center-dashboard-restored-20260730-1' "${root}" \
              && grep -q 'five-center-dashboard-direct-studio-chunks-20260730-4' "${root}" \
              && grep -q 'legacy-runtime-loader.js' "${root}" \
              && ! grep -q 'executive-local-inference.js' "${root}" \
              && ! grep -q 'kairos-runtime-loader.js' "${root}" \
              && [ "${safari_status}" = "200" ] \
              && grep -q 'safari-manuscript-intake-compat-20260730-12-five-center' "${safari}" \
              && grep -q 'COMMAND_HUB_MODE' "${safari}" \
              && [ "${loader_status}" = "200" ] \
              && grep -q 'kairos-five-center-runtime-loader-20260730-1' "${loader}" \
              && grep -q 'five-center-dashboard-direct-studio-chunks-20260730-4' "${loader}" \
              && grep -q 'commandHubMode' "${loader}" \
              && grep -q 'command-hub.js' "${loader}" \
              && printf '%s' "${active_scripts}" | grep -q 'manuscript-studio.js' \
              && ! printf '%s' "${active_scripts}" | grep -q 'manuscript-docx-upload-hotfix.js' \
              && [ "${studio_status}" = "200" ] \
              && grep -q 'manuscript-studio-direct-chunks-20260730-4' "${studio}" \
              && grep -q 'chunkedSourceUpload: true' "${studio}" \
              && grep -q 'multipartSourceUpload: false' "${studio}" \
              && grep -q 'FILE_CHUNK_BYTES = 512 \* 1024' "${studio}" \
              && grep -q 'TEXT_CHUNK_BYTES = 128 \* 1024' "${studio}" \
              && ! grep -q 'new FormData' "${studio}" \
              && [ "${compatibility_loader_status}" = "200" ] \
              && ! grep -q 'executive-local-inference.js' "${compatibility_loader}" \
              && [ "${command_status}" = "200" ] \
              && [ "${parent_center_count}" = "5" ] \
              && grep -q 'Five operating centers' "${command}" \
              && [ "${bridge_status}" = "200" ] \
              && grep -q 'browser-webgpu' "${bridge}" \
              && grep -q '../vendor/webllm-bundle.js' "${bridge}" \
              && [ "${inference_status}" = "200" ] \
              && grep -q '../vendor/webllm-bundle.js' "${inference}" \
              && [ "${bundle_status}" = "200" ] \
              && grep -q 'CreateMLCEngine' "${bundle}" \
              && [ "${readiness_status}" = "200" ] \
              && grep -qi 'x-kairos-canonical-local: kairos-local-canonical-entry-20260730-1' "${canonical_headers}" \
              && grep -qi 'x-kairos-openai-calls: disabled' "${canonical_headers}" \
              && grep -q '"ready":true' "${readiness}" \
              && grep -q '"provider":"browser-webgpu"' "${readiness}" \
              && grep -q '"externalPaidAPIUsed":false' "${readiness}" \
              && grep -q '"backendProviderCalls":false' "${readiness}" \
              && grep -q '"cloudflareNeuronsUsed":0' "${readiness}" \
              && [ "${workflows_status}" = "200" ] \
              && grep -q '"status":"ready"' "${workflows}" \
              && [ "${api_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${api_denial}" \
              && [ "${manuscript_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${manuscript_denial}" \
              && [ "${revenue_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${revenue_denial}" \
              && [ "${shopify_denial_status}" = "403" ] \
              && grep -q '"code":"WEBSITE_MUTATION_DENIED"' "${shopify_denial}"; then

              project_id="studio-live-${GITHUB_RUN_ID}-${attempt}"
              upload_id="upload-${GITHUB_RUN_ID}-${attempt}"
              text='Kairos direct Studio chunk verification.'
              printf 'PK\003\004direct-studio-docx' > "${RUNNER_TEMP}/source.bin"
              printf '%s' "${text}" > "${RUNNER_TEMP}/text.bin"
              file_size="$(wc -c < "${RUNNER_TEMP}/source.bin" | tr -d ' ')"
              text_size="$(wc -c < "${RUNNER_TEMP}/text.bin" | tr -d ' ')"
              base="${WORKER_URL}/api/production-registry/manuscripts/${project_id}/source"

              session_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-session.json" -w '%{http_code}' -X POST "${base}/session" -H 'Content-Type: application/json' -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' --data "{\"uploadId\":\"${upload_id}\",\"title\":\"Live Direct Studio Probe\",\"filename\":\"probe.docx\",\"format\":\"docx\",\"size\":${file_size},\"textBytes\":${text_size},\"fileChunks\":1,\"textChunks\":1}")"
              file_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-file.json" -w '%{http_code}' -X PUT "${base}/file/0" -H 'Content-Type: application/octet-stream' -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' -H "X-Kairos-Upload-Id: ${upload_id}" --data-binary "@${RUNNER_TEMP}/source.bin")"
              text_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-text.json" -w '%{http_code}' -X PUT "${base}/text-chunk/0" -H 'Content-Type: application/octet-stream' -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' -H "X-Kairos-Upload-Id: ${upload_id}" --data-binary "@${RUNNER_TEMP}/text.bin")"
              commit_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-commit.json" -w '%{http_code}' -X POST "${base}/commit" -H 'Content-Type: application/json' -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' -H "X-Kairos-Upload-Id: ${upload_id}" --data "{\"uploadId\":\"${upload_id}\"}")"
              read_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-read.json" -w '%{http_code}' "${base}/text")"
              cleanup_status="$(curl --silent --show-error --max-time 30 -o "${RUNNER_TEMP}/chunk-delete.json" -w '%{http_code}' -X DELETE "${base}")"

              test "${session_status}" = "201"
              test "${file_status}" = "201"
              test "${text_status}" = "201"
              test "${commit_status}" = "201"
              test "${read_status}" = "200"
              test "${cleanup_status}" = "200"
              grep -q '"status":"stored-and-verified"' "${RUNNER_TEMP}/chunk-commit.json"
              grep -q '"uploadMode":"chunked-v1"' "${RUNNER_TEMP}/chunk-commit.json"
              grep -q 'Kairos direct Studio chunk verification.' "${RUNNER_TEMP}/chunk-read.json"

              echo "Five-center Kairos dashboard and live direct Studio chunk runtime verified."
              cat "${readiness}"
              cat "${workflows}"
              cat "${RUNNER_TEMP}/chunk-commit.json"
              exit 0
            fi

            if [ "${attempt}" = "30" ]; then
              echo "Five-center direct-Studio chunk verification failed."
              printf 'root=%s safari=%s loader=%s compatibility=%s command=%s studio=%s bridge=%s inference=%s bundle=%s readiness=%s workflows=%s api=%s manuscript=%s revenue=%s shopify=%s parents=%s\n' \
                "${root_status}" "${safari_status}" "${loader_status}" "${compatibility_loader_status}" "${command_status}" "${studio_status}" "${bridge_status}" "${inference_status}" "${bundle_status}" "${readiness_status}" "${workflows_status}" "${api_denial_status}" "${manuscript_denial_status}" "${revenue_denial_status}" "${shopify_denial_status}" "${parent_center_count}"
              cat "${canonical_headers}" || true
              cat "${root}" || true
              cat "${safari}" || true
              cat "${loader}" || true
              cat "${compatibility_loader}" || true
              cat "${command}" || true
              cat "${studio}" || true
              cat "${readiness}" || true
              cat "${workflows}" || true
              exit 1
            fi
            sleep 5
          done

      - name: Report deployment success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-browser-runtime\",\"description\":\"Direct Studio chunk runtime deployed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-browser-runtime\",\"description\":\"Direct Studio chunk deployment failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
