name: Deploy Kairos Browser and Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'backend-tests/**'
      - 'tests/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-browser-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report deployment pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-browser-runtime\",\"description\":\"Deploying local-only Kairos browser and runtime\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out authorized main commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build and validate same-origin WebLLM runtime
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js
          node --check web/kairos-dashboard/scripts/kairos-runtime-loader.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts

      - name: Enforce local-only inference configuration
        run: |
          grep -q 'main = "src/kairos-production-entry-local-execution-v1.js"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_NO_COST_MODE = "true"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_LOCAL_INFERENCE_ENABLED = "true"' cloudflare/mmg-ios/wrangler.toml
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          ! grep -q 'cdn.jsdelivr.net' web/kairos-dashboard/scripts/executive-local-inference.js
          ! grep -q 'esm.run' web/kairos-dashboard/scripts/executive-local-inference.js

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate production bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy production Worker and browser assets
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify live DOCX extraction, clean Executive OS, and local inference runtime
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="${RUNNER_TEMP}/kairos.html"
            safari="${RUNNER_TEMP}/safari.js"
            executive="${RUNNER_TEMP}/executive.js"
            runtime_loader="${RUNNER_TEMP}/runtime-loader.js"
            legacy="${RUNNER_TEMP}/legacy.js"
            local_bridge="${RUNNER_TEMP}/executive-local-inference.js"
            local_inference="${RUNNER_TEMP}/kairos-local-inference-same-origin.js"
            local_bundle="${RUNNER_TEMP}/webllm-bundle.js"
            docx="${RUNNER_TEMP}/docx-resolver.js"
            manuscript="${RUNNER_TEMP}/manuscript.js"
            health="${RUNNER_TEMP}/health.json"
            readiness="${RUNNER_TEMP}/readiness.json"
            workflows="${RUNNER_TEMP}/workflows.json"
            brief="${RUNNER_TEMP}/brief.json"
            provider_denial="${RUNNER_TEMP}/provider-denial.json"

            html_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${html}" -w '%{http_code}' || true)"
            safari_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/safari-manuscript-intake-compat.js?v=safari-docx-export-resolver-20260730-1&release=${GITHUB_SHA}&attempt=${attempt}" -o "${safari}" -w '%{http_code}' || true)"
            executive_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-os.js?v=browser-finish-20260729-5&release=${GITHUB_SHA}&attempt=${attempt}" -o "${executive}" -w '%{http_code}' || true)"
            runtime_loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-runtime-loader.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${runtime_loader}" -w '%{http_code}' || true)"
            legacy_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/legacy-runtime-loader.js?v=legacy-docx-export-resolver-20260730-1&release=${GITHUB_SHA}&attempt=${attempt}" -o "${legacy}" -w '%{http_code}' || true)"
            local_bridge_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-local-inference.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${local_bridge}" -w '%{http_code}' || true)"
            local_inference_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-local-inference-same-origin.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${local_inference}" -w '%{http_code}' || true)"
            local_bundle_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/vendor/webllm-bundle.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${local_bundle}" -w '%{http_code}' || true)"
            docx_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/manuscript-docx-upload-hotfix.js?v=manuscript-docx-export-resolver-20260730-1&release=${GITHUB_SHA}&attempt=${attempt}" -o "${docx}" -w '%{http_code}' || true)"
            manuscript_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/manuscript-studio.js?v=manuscript-upload-retention-20260730-1&release=${GITHUB_SHA}&attempt=${attempt}" -o "${manuscript}" -w '%{http_code}' || true)"
            health_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/health?release=${GITHUB_SHA}&attempt=${attempt}" -o "${health}" -w '%{http_code}' || true)"
            readiness_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/operational-readiness?release=${GITHUB_SHA}&attempt=${attempt}" -o "${readiness}" -w '%{http_code}' || true)"
            workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?release=${GITHUB_SHA}&attempt=${attempt}" -o "${workflows}" -w '%{http_code}' || true)"
            brief_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/executive-briefing/latest?release=${GITHUB_SHA}&attempt=${attempt}" -o "${brief}" -w '%{http_code}' || true)"
            provider_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${provider_denial}" -w '%{http_code}' || true)"

            module_count="$(grep -o '<script type="module"' "${html}" | wc -l | tr -d ' ')"
            resolver_line="$(grep -n 'manuscript-docx-upload-hotfix.js' "${legacy}" | head -1 | cut -d: -f1 || true)"
            studio_line="$(grep -n 'manuscript-studio.js' "${legacy}" | head -1 | cut -d: -f1 || true)"

            if [ "${html_status}" = "200" ] \
              && grep -q 'Kairos Executive Operating System' "${html}" \
              && grep -q 'kairos-executive-local-inference-20260730-1' "${html}" \
              && grep -q 'safari-docx-export-resolver-20260730-1' "${html}" \
              && grep -q 'kairos-runtime-loader.js' "${html}" \
              && [ "${module_count}" = "2" ] \
              && ! grep -q 'command-hub.js' "${html}" \
              && ! grep -q 'manuscript-studio.js' "${html}" \
              && [ "${safari_status}" = "200" ] \
              && grep -q 'safari-manuscript-intake-compat-20260730-11-docx' "${safari}" \
              && grep -q 'nativeDigest(algorithm, data)' "${safari}" \
              && [ "${executive_status}" = "200" ] \
              && grep -q 'kairos-abos-v2-browser-finish-20260729-5' "${executive}" \
              && grep -q 'renderEmergencyRecovery' "${executive}" \
              && [ "${runtime_loader_status}" = "200" ] \
              && grep -q 'legacy-runtime-loader.js' "${runtime_loader}" \
              && grep -q 'executive-local-inference.js' "${runtime_loader}" \
              && [ "${legacy_status}" = "200" ] \
              && grep -q 'kairos-legacy-runtime-loader-20260730-3-docx' "${legacy}" \
              && grep -q 'manuscript-docx-upload-hotfix.js' "${legacy}" \
              && grep -q 'manuscript-studio.js' "${legacy}" \
              && [ -n "${resolver_line}" ] \
              && [ -n "${studio_line}" ] \
              && [ "${resolver_line}" -lt "${studio_line}" ] \
              && [ "${local_bridge_status}" = "200" ] \
              && grep -q 'kairos-executive-local-inference-20260730-1' "${local_bridge}" \
              && grep -q 'browser-webgpu' "${local_bridge}" \
              && grep -q '../vendor/webllm-bundle.js' "${local_bridge}" \
              && [ "${local_inference_status}" = "200" ] \
              && grep -q '../vendor/webllm-bundle.js' "${local_inference}" \
              && [ "${local_bundle_status}" = "200" ] \
              && grep -q 'CreateMLCEngine' "${local_bundle}" \
              && [ "${docx_status}" = "200" ] \
              && grep -q 'manuscript-docx-upload-hotfix-20260730-1' "${docx}" \
              && grep -Fq 'typeof candidate?.extractRawText === "function"' "${docx}" \
              && [ "${manuscript_status}" = "200" ] \
              && grep -q 'manuscript-studio-upload-retention-20260730-1' "${manuscript}" \
              && grep -q 'Retry source save' "${manuscript}" \
              && [ "${health_status}" = "200" ] \
              && [ "${readiness_status}" = "200" ] \
              && grep -q '"status":"ready"' "${readiness}" \
              && grep -q '"provider":"browser-webgpu"' "${readiness}" \
              && grep -q '"externalPaidAPIUsed":false' "${readiness}" \
              && grep -q '"backendProviderCalls":false' "${readiness}" \
              && grep -q '"cloudflareNeuronsUsed":0' "${readiness}" \
              && [ "${workflows_status}" = "200" ] \
              && grep -q '"status":"ready"' "${workflows}" \
              && grep -q '"workflows":\[' "${workflows}" \
              && [ "${provider_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${provider_denial}" \
              && { [ "${brief_status}" = "200" ] || [ "${brief_status}" = "404" ]; }; then
              echo "Live DOCX extraction, two-module clean boot, and local-only Kairos inference verified."
              cat "${health}"
              cat "${readiness}"
              cat "${workflows}"
              cat "${provider_denial}"
              exit 0
            fi
            sleep 5
          done

          echo "HTML status: ${html_status}"
          echo "Homepage module count: ${module_count}"
          echo "Runtime loader status: ${runtime_loader_status}"
          echo "Local bridge status: ${local_bridge_status}"
          echo "Local inference status: ${local_inference_status}"
          echo "WebLLM bundle status: ${local_bundle_status}"
          echo "Health status: ${health_status}"
          echo "Operational readiness status: ${readiness_status}"
          echo "Provider denial status: ${provider_denial_status}"
          cat "${html}" || true
          cat "${runtime_loader}" || true
          cat "${local_bridge}" || true
          cat "${local_inference}" || true
          cat "${readiness}" || true
          cat "${provider_denial}" || true
          exit 1

      - name: Verify direct website mutation firewall
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/shopify-denial.json"
          status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/shopify/page-shell/publish" -H 'Content-Type: application/json' --data '{}' -o "${body}" -w '%{http_code}' || true)"
          cat "${body}"
          test "${status}" = "403"
          grep -q '"code":"WEBSITE_MUTATION_DENIED"' "${body}"

      - name: Report deployment success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-browser-runtime\",\"description\":\"Local-only Kairos runtime deployed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-browser-runtime\",\"description\":\"Kairos local-only browser/runtime deployment failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
