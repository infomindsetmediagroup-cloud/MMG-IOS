name: Deploy Kairos Browser and Runtime

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'web/kairos-dashboard/**'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'cloudflare/mmg-ios/src/**'
      - 'cloudflare/mmg-ios/scripts/**'
      - 'cloudflare/mmg-ios/test/**'
      - 'backend-tests/**'
      - 'browser-tests/**'
      - 'tests/**'

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-browser-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Report deployment pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-browser-runtime\",\"description\":\"Deploying manuscript setup shard runtime\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out authorized main commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build same-origin WebLLM runtime
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js

      - name: Validate Kairos browser manuscript and setup contracts
        run: |
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-registry-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-source-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-source-shard-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-project-setup-v1.js
          node --check web/kairos-dashboard/scripts/safari-manuscript-intake-compat.js
          node --check web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node --check web/kairos-dashboard/scripts/kairos-runtime-loader.js
          node --check web/kairos-dashboard/scripts/command-hub.js
          node --check web/kairos-dashboard/scripts/manuscript-studio.js
          node --check web/kairos-dashboard/scripts/manuscript-project-setup.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-source-forwarding.test.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-chunked-upload.test.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-setup-shard.test.js
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts
          node cloudflare/mmg-ios/scripts/validate-manuscript-large-intake.mjs
          node --test tests/kairos-operational-execution-bridge.contract.test.js
          node --check browser-tests/manuscript-studio-direct-chunk.spec.mjs
          grep -q 'kairos-five-center-dashboard-restored-20260730-1' web/kairos-dashboard/index.html
          grep -q 'five-center-dashboard-direct-studio-chunks-20260730-4' web/kairos-dashboard/index.html
          grep -q 'legacy-runtime-loader.js' web/kairos-dashboard/index.html
          grep -q 'manuscript-studio-direct-chunks-20260730-4' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'chunkedSourceUpload: true' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'multipartSourceUpload: false' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'FILE_CHUNK_BYTES = 512 \* 1024' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'TEXT_CHUNK_BYTES = 128 \* 1024' web/kairos-dashboard/scripts/manuscript-studio.js
          ! grep -q 'new FormData' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'main = "src/kairos-production-entry-local-canonical-v1.js"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_NO_COST_MODE = "true"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_LOCAL_INFERENCE_ENABLED = "true"' cloudflare/mmg-ios/wrangler.toml
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Verify direct Studio forced-502 recovery in WebKit
        run: npx playwright test browser-tests/manuscript-studio-direct-chunk.spec.mjs --project=webkit

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate production Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy production Worker and browser assets
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify live dashboard source setup and recovery runtime
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            root="${RUNNER_TEMP}/root.html"
            safari="${RUNNER_TEMP}/safari.js"
            loader="${RUNNER_TEMP}/legacy-loader.js"
            command="${RUNNER_TEMP}/command-hub.js"
            studio="${RUNNER_TEMP}/manuscript-studio.js"
            readiness="${RUNNER_TEMP}/readiness.json"
            workflows="${RUNNER_TEMP}/workflows.json"
            canonical_headers="${RUNNER_TEMP}/canonical-headers.txt"
            api_denial="${RUNNER_TEMP}/api-denial.json"
            manuscript_denial="${RUNNER_TEMP}/manuscript-denial.json"
            shopify_denial="${RUNNER_TEMP}/shopify-denial.json"

            root_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${root}" -w '%{http_code}' || true)"
            safari_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/safari-manuscript-intake-compat.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${safari}" -w '%{http_code}' || true)"
            loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/legacy-runtime-loader.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${loader}" -w '%{http_code}' || true)"
            command_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/command-hub.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${command}" -w '%{http_code}' || true)"
            studio_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/manuscript-studio.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${studio}" -w '%{http_code}' || true)"
            readiness_status="$(curl --silent --show-error --max-time 20 -D "${canonical_headers}" "${WORKER_URL}/api/operational-readiness?release=${GITHUB_SHA}&attempt=${attempt}" -o "${readiness}" -w '%{http_code}' || true)"
            workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?release=${GITHUB_SHA}&attempt=${attempt}" -o "${workflows}" -w '%{http_code}' || true)"
            api_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${api_denial}" -w '%{http_code}' || true)"
            manuscript_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/production-registry/manuscripts/test-project-12345678/generation-job" -H 'Content-Type: application/json' --data '{}' -o "${manuscript_denial}" -w '%{http_code}' || true)"
            shopify_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/shopify/page-shell/publish" -H 'Content-Type: application/json' --data '{}' -o "${shopify_denial}" -w '%{http_code}' || true)"

            module_count="$(grep -o '<script type="module"' "${root}" | wc -l | tr -d ' ')"
            parent_center_count="$(grep -o 'id: "\(knowledge\|content\|business\|customers\|operations\)"' "${command}" | wc -l | tr -d ' ')"

            if [ "${root_status}" = "200" ] \
              && [ "${module_count}" = "2" ] \
              && grep -q 'five-center-dashboard-direct-studio-chunks-20260730-4' "${root}" \
              && [ "${safari_status}" = "200" ] \
              && grep -q 'COMMAND_HUB_MODE' "${safari}" \
              && [ "${loader_status}" = "200" ] \
              && grep -q 'manuscript-studio.js' "${loader}" \
              && [ "${command_status}" = "200" ] \
              && [ "${parent_center_count}" = "5" ] \
              && [ "${studio_status}" = "200" ] \
              && grep -q 'manuscript-studio-direct-chunks-20260730-4' "${studio}" \
              && [ "${readiness_status}" = "200" ] \
              && grep -qi 'x-kairos-canonical-local: kairos-local-canonical-entry-20260730-2-direct-intake' "${canonical_headers}" \
              && grep -qi 'x-kairos-source-shard: kairos-manuscript-source-shard-20260730-2-setup-colocation' "${canonical_headers}" \
              && grep -qi 'x-kairos-openai-calls: disabled' "${canonical_headers}" \
              && grep -q '"ready":true' "${readiness}" \
              && grep -q '"provider":"browser-webgpu"' "${readiness}" \
              && grep -q '"externalPaidAPIUsed":false' "${readiness}" \
              && [ "${workflows_status}" = "200" ] \
              && grep -q '"status":"ready"' "${workflows}" \
              && [ "${api_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${api_denial}" \
              && [ "${manuscript_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${manuscript_denial}" \
              && [ "${shopify_denial_status}" = "403" ] \
              && grep -q '"code":"WEBSITE_MUTATION_DENIED"' "${shopify_denial}"; then

              work="${RUNNER_TEMP}/setup-live-${attempt}"
              mkdir -p "${work}"
              project_id="setup-live-${GITHUB_RUN_ID}-${attempt}"
              upload_id="upload-${GITHUB_RUN_ID}-${attempt}"
              operation_id="setup-${GITHUB_RUN_ID}-${attempt}"
              source_base="${WORKER_URL}/api/production-registry/manuscripts/${project_id}/source"
              setup_base="${WORKER_URL}/api/production-registry/manuscripts/${project_id}/setup"

              cleanup() {
                curl --silent --show-error --max-time 30 -X DELETE "${setup_base}/cover" -o "${work}/cover-cleanup.json" -w 'cover_cleanup=%{http_code}\n' || true
                curl --silent --show-error --max-time 30 -X DELETE "${source_base}" -o "${work}/source-cleanup.json" -w 'source_cleanup=%{http_code}\n' || true
                curl --silent --show-error --max-time 30 -X DELETE "${WORKER_URL}/api/production-registry/projects/${project_id}" -o "${work}/project-cleanup.json" -w 'project_cleanup=%{http_code}\n' || true
              }
              trap cleanup EXIT

              printf 'PK\003\004Kairos manuscript setup live source' > "${work}/source.bin"
              printf '%s' 'This bounded live manuscript contains enough extracted text to verify source storage, cover storage, production assignment, and saved-status recovery without publication.' > "${work}/text.bin"
              printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2nYQAAAAASUVORK5CYII=' | base64 --decode > "${work}/cover.png"
              file_size="$(wc -c < "${work}/source.bin" | tr -d ' ')"
              text_size="$(wc -c < "${work}/text.bin" | tr -d ' ')"

              session_status="$(curl --silent --show-error --max-time 30 -o "${work}/session.json" -w '%{http_code}' -X POST "${source_base}/session" -H 'Content-Type: application/json' -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' --data "{\"uploadId\":\"${upload_id}\",\"title\":\"Live Manuscript Setup Diagnostic\",\"filename\":\"diagnostic.docx\",\"contentType\":\"application/vnd.openxmlformats-officedocument.wordprocessingml.document\",\"format\":\"docx\",\"size\":${file_size},\"textBytes\":${text_size},\"fileChunks\":1,\"textChunks\":1}")"
              file_status="$(curl --silent --show-error --max-time 30 -o "${work}/file.json" -w '%{http_code}' -X PUT "${source_base}/file/0" -H 'Content-Type: application/octet-stream' -H "X-Kairos-Upload-Id: ${upload_id}" --data-binary "@${work}/source.bin")"
              text_status="$(curl --silent --show-error --max-time 30 -o "${work}/text.json" -w '%{http_code}' -X PUT "${source_base}/text-chunk/0" -H 'Content-Type: application/octet-stream' -H "X-Kairos-Upload-Id: ${upload_id}" --data-binary "@${work}/text.bin")"
              commit_status="$(curl --silent --show-error --max-time 30 -o "${work}/commit.json" -w '%{http_code}' -X POST "${source_base}/commit" -H 'Content-Type: application/json' -H "X-Kairos-Upload-Id: ${upload_id}" --data "{\"uploadId\":\"${upload_id}\"}")"
              cover_status="$(curl --silent --show-error --max-time 30 -o "${work}/cover.json" -w '%{http_code}' -X PUT "${setup_base}/cover" -H 'Content-Type: image/png' -H 'X-Filename: diagnostic-cover.png' -H "X-Kairos-Operation-Id: ${operation_id}" --data-binary "@${work}/cover.png")"
              printf '%s' "{\"authorName\":\"MMG Runtime Diagnostic\",\"publicationTitle\":\"Live Manuscript Setup Diagnostic\",\"service\":\"complete-publishing-package\",\"edition\":\"multi-format\",\"trimSize\":\"6x9\",\"isbnStatus\":\"not-decided\",\"notes\":\"Bounded route verification only.\",\"operationId\":\"${operation_id}\"}" > "${work}/setup.json"

              setup_status="$(curl --silent --show-error --max-time 30 -D "${work}/setup-headers.txt" -o "${work}/setup-response.json" -w '%{http_code}' -X POST "${setup_base}" -H 'Content-Type: application/json' -H "X-Kairos-Operation-Id: ${operation_id}" -H "X-Kairos-Idempotency-Key: ${operation_id}" --data-binary "@${work}/setup.json")"
              recovery_status="$(curl --silent --show-error --max-time 30 -o "${work}/recovery.json" -w '%{http_code}' "${setup_base}")"

              printf 'session=%s file=%s text=%s commit=%s cover=%s setup=%s recovery=%s\n' "${session_status}" "${file_status}" "${text_status}" "${commit_status}" "${cover_status}" "${setup_status}" "${recovery_status}"
              cat "${work}/setup-headers.txt"
              cat "${work}/setup-response.json"
              echo
              cat "${work}/recovery.json"
              echo

              test "${session_status}" = "201"
              test "${file_status}" = "201"
              test "${text_status}" = "201"
              test "${commit_status}" = "201"
              test "${cover_status}" = "201"
              test "${setup_status}" = "201"
              test "${recovery_status}" = "200"
              grep -qi 'x-kairos-source-shard: kairos-manuscript-source-shard-20260730-2-setup-colocation' "${work}/setup-headers.txt"
              grep -Eqi 'x-kairos-global-project-mirror: (synced|pending)' "${work}/setup-headers.txt"
              grep -q '"status":"assigned-to-production"' "${work}/setup-response.json"
              grep -q '"coverStatus":"customer-supplied-cover-stored"' "${work}/setup-response.json"
              grep -q '"externalInferenceAPI":false' "${work}/setup-response.json"
              grep -q '"status":"ready"' "${work}/recovery.json"
              grep -q '"status":"assigned-to-production"' "${work}/recovery.json"

              cleanup
              trap - EXIT
              echo "Live source, cover, setup assignment, and saved-status recovery verified."
              exit 0
            fi

            if [ "${attempt}" = "30" ]; then
              echo "Live Kairos setup-shard verification failed."
              printf 'root=%s safari=%s loader=%s command=%s studio=%s readiness=%s workflows=%s api=%s manuscript=%s shopify=%s parents=%s\n' \
                "${root_status}" "${safari_status}" "${loader_status}" "${command_status}" "${studio_status}" "${readiness_status}" "${workflows_status}" "${api_denial_status}" "${manuscript_denial_status}" "${shopify_denial_status}" "${parent_center_count}"
              cat "${canonical_headers}" || true
              cat "${readiness}" || true
              cat "${workflows}" || true
              exit 1
            fi
            sleep 5
          done

      - name: Report deployment success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-browser-runtime\",\"description\":\"Manuscript setup shard verified in production\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-browser-runtime\",\"description\":\"Manuscript setup shard deployment failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
