name: Patch Digital Asset V2 Cache Key

on:
  push:
    branches:
      - fix/canonical-digital-asset-v2-main-20260805
    paths:
      - ".github/workflows/patch-digital-asset-v2-cache-key.yml"

permissions:
  contents: write

jobs:
  patch-cache-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace retired five-file cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('web/kairos-dashboard/manuscript.html')
          text = path.read_text()
          old = 'kairos-manuscript-final-delivery-control-20260805-5-five-file-route'
          new = 'kairos-manuscript-final-delivery-control-20260805-6-canonical-digital-asset-v2'
          if old not in text:
              raise SystemExit('retired cache key not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/kairos-dashboard/manuscript.html
          git commit -m "Load canonical Digital Asset V2 final-delivery runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
