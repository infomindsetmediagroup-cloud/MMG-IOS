name: Validate Kairos Digital Asset V2

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/mmg-ios/src/kairos-production-entry-digital-asset-v2-v1.js'
      - 'cloudflare/mmg-ios/src/kairos-digital-asset-*.js'
      - 'cloudflare/mmg-ios/src/kairos-creation-artifacts-v1.js'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'scripts/validate-kairos-manuscript-activation.mjs'
      - 'governance/mmg-digital-asset-edition-v2-contract-v1.json'
      - '.github/workflows/deploy-kairos-digital-asset-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/mmg-ios/src/kairos-production-entry-digital-asset-v2-v1.js'
      - 'cloudflare/mmg-ios/src/kairos-digital-asset-*.js'
      - 'cloudflare/mmg-ios/src/kairos-creation-artifacts-v1.js'
      - 'cloudflare/mmg-ios/wrangler.toml'
      - 'scripts/validate-kairos-manuscript-activation.mjs'
      - 'governance/mmg-digital-asset-edition-v2-contract-v1.json'
      - '.github/workflows/deploy-kairos-digital-asset-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-kairos-digital-asset-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Digital Asset V2 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate V2 runtime syntax and activation contract
        run: |
          node --check cloudflare/mmg-ios/src/kairos-digital-asset-edition-v2-contract-v1.js
          node --check cloudflare/mmg-ios/src/kairos-digital-asset-v2-manuscript-writer-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-digital-asset-v2-v1.js
          node --check cloudflare/mmg-ios/src/kairos-creation-artifacts-v1.js
          node scripts/validate-kairos-manuscript-activation.mjs

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Confirm canonical deployment ownership
        run: |
          grep -Fq 'name: Deploy Canonical Kairos Worker' .github/workflows/deploy-kairos-canonical-worker.yml
          echo 'Digital Asset V2 validation complete. Production deployment is owned by deploy-kairos-canonical-worker.yml.'
