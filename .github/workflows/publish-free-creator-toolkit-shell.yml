name: Guard Retired Audited Page Repair

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-free-creator-toolkit-shell.yml"
      - "cloudflare/mmg-ios/src/kairos-native-page-content-repair-v1.js"
      - "cloudflare/mmg-ios/src/kairos-production-entry-theme-menu-hotfix-v1.js"
  pull_request:
    paths:
      - ".github/workflows/publish-free-creator-toolkit-shell.yml"
      - "cloudflare/mmg-ios/src/kairos-native-page-content-repair-v1.js"
      - "cloudflare/mmg-ios/src/kairos-production-entry-theme-menu-hotfix-v1.js"
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

concurrency:
  group: guard-retired-audited-page-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify legacy audited-page repair remains disabled
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLED_BUILD: kairos-native-page-content-repair-disabled-20260722-1
      STATUS_CONTEXT: mmg-audited-pages-live

    steps:
      - name: Mark pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"pending",context:process.env.STATUS_CONTEXT,description:"Verifying retired audited-page repair boundary",target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Check out exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify retired mutation boundary
        run: |
          set -euo pipefail
          repair="cloudflare/mmg-ios/src/kairos-native-page-content-repair-v1.js"
          entry="cloudflare/mmg-ios/src/kairos-production-entry-theme-menu-hotfix-v1.js"

          node --check "${repair}"
          node --check "${entry}"
          grep -Fq "${DISABLED_BUILD}" "${repair}"
          grep -Fq 'export async function handleNativePageRepair()' "${repair}"
          grep -Fq 'return null;' "${repair}"
          ! grep -Fq 'kairos-native-page-content-repair-v1.js' "${entry}"
          ! grep -Fq '/api/shopify/pages/repair' "${entry}"
          ! grep -Eq 'REPAIR_MMG_AUDITED_PAGES_NOW|handleNativePageRepair\(' "${entry}"

      - name: Report result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "${JOB_STATUS}" = "success" ]; then
            state="success"
            description="Legacy audited-page repair is safely retired"
          else
            state="failure"
            description="Retired audited-page repair boundary changed"
          fi
          payload="$(STATE="${state}" DESCRIPTION="${description}" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.STATUS_CONTEXT,description:process.env.DESCRIPTION,target_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"
