name: Validate Kairos Change

on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/kairos/**'
      - 'cloudflare/mmg-ios/**'
      - 'cloudflare/mmg-ios-worker.js'
      - 'server/kairos/**'
      - 'backend-tests/**'
      - 'browser-tests/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'governance/kairos-shopify-operation-scope-v1.json'
      - 'governance/kairos-builder-plugin-registry-v1.json'
      - 'scripts/validate-kairos-shopify-policy.mjs'
      - 'scripts/validate-kairos-manuscript-activation.mjs'
      - 'scripts/validate-kairos-entrypoint-graph.mjs'
      - 'docs/runbooks/kairos-cloudflare-native-shopify-runtime.md'
      - 'docs/runbooks/kairos-builder-plugin-operating-model.md'
      - 'package.json'
      - 'wrangler.toml'
      - 'web/kairos-dashboard/**'
      - '.github/workflows/validate-kairos-change.yml'
      - '.github/workflows/deploy-kairos-manuscript-runtime.yml'
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
  workflow_dispatch:

concurrency:
  group: validate-kairos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm install --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate active Kairos entrypoint graph
        run: npm run validate:kairos-entrypoints

      - name: Validate Cloudflare runtime syntax
        run: |
          node --check cloudflare/mmg-ios-worker.js
          node --check cloudflare/kairos/shopify-doctrine.js
          node --check cloudflare/kairos/workflow-registry.js
          node --check cloudflare/kairos/scope-firewall.js
          node --check cloudflare/kairos/shopify-client.js
          node --check cloudflare/kairos/operation-registry.js
          node --check cloudflare/kairos/runtime.js
          node --check cloudflare/kairos/deterministic-planner.js
          node --check cloudflare/kairos/intelligence-runtime.js
          node --check cloudflare/kairos/intelligence-api.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-inference-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-operational-execution-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-registry-v1.js
          node --check cloudflare/mmg-ios/src/kairos-project-agent-v1.js
          node --check cloudflare/mmg-ios/src/kairos-project-agent-api-v1.js
          node --check cloudflare/mmg-ios/src/kairos-project-foundation-workflow-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-generation-job-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-generation-workflow-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-start-router-v1.js
          node --check cloudflare/mmg-ios/src/kairos-runtime-health-v1.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-operation-boundary-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-manuscript-online-v1.js
          node --check web/kairos-dashboard/scripts/executive-os.js
          node --check web/kairos-dashboard/scripts/executive-os-live-details.js
          node --check web/kairos-dashboard/scripts/safari-manuscript-intake-compat.js
          node --check web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node --check web/kairos-dashboard/scripts/manuscript-project-setup.js
          node --check web/kairos-dashboard/scripts/manuscript-editorial-workbench.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
          node --check web/kairos-dashboard/scripts/publication-performance.js
          node --check scripts/validate-kairos-shopify-policy.mjs
          node --check scripts/validate-kairos-manuscript-activation.mjs
          node --check scripts/validate-kairos-entrypoint-graph.mjs

      - name: Test buffered manuscript source forwarding
        run: node --test cloudflare/mmg-ios/test/kairos-manuscript-source-forwarding.test.js

      - name: Test Kairos scope firewall
        run: npx vitest run backend-tests/kairos-scope-firewall.test.js

      - name: Test Kairos manuscript operation boundary
        run: npx vitest run backend-tests/kairos-manuscript-operation-boundary.test.js

      - name: Test Kairos self-hosted runtime
        run: npx vitest run backend-tests/kairos-self-hosted-runtime.test.ts

      - name: Test Kairos project agent foundation
        run: npx vitest run backend-tests/kairos-project-agent-foundation.test.ts

      - name: Test Kairos manuscript generation workflow
        run: npx vitest run backend-tests/kairos-manuscript-generation-workflow.test.ts

      - name: Test operational browser execution bridge
        run: node --test tests/kairos-operational-execution-bridge.contract.test.js

      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Test manuscript buttons in mobile WebKit
        id: webkit
        shell: bash
        run: |
          set +e
          npm run test:manuscript-ui > "${RUNNER_TEMP}/manuscript-webkit.log" 2>&1
          status=$?
          cp "${RUNNER_TEMP}/manuscript-webkit.log" manuscript-webkit.log
          if [ "${status}" -ne 0 ]; then
            echo "Mobile WebKit interaction failure:"
            tail -n 220 manuscript-webkit.log
            exit "${status}"
          fi
          tail -n 60 manuscript-webkit.log

      - name: Upload WebKit failure evidence
        if: ${{ failure() && steps.webkit.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-webkit-failure
          path: |
            manuscript-webkit.log
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Kairos Shopify policy
        if: ${{ always() }}
        run: npm run validate:kairos-shopify

      - name: Validate manuscript activation and builder plugins
        if: ${{ always() }}
        run: npm run validate:manuscript-activation

      - name: Validate Shopify governance
        if: ${{ always() }}
        run: npm run validate:shopify

      - name: Validate canonical service product
        if: ${{ always() }}
        run: npm run validate:service-product

      - name: Install active Worker dependencies
        if: ${{ always() }}
        working-directory: cloudflare/mmg-ios
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Validate active Cloudflare manuscript bundle
        if: ${{ always() }}
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run
