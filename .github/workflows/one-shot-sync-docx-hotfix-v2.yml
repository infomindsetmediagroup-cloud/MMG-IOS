name: One-shot resync DOCX hotfix with main

on:
  push:
    branches:
      - hotfix/docx-mammoth-export-resolution
    paths:
      - '.github/workflows/one-shot-sync-docx-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/docx-mammoth-export-resolution
          fetch-depth: 0

      - name: Merge current main without discarding DOCX changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/one-shot-sync-docx-hotfix-v2.yml
          git add -A
          git commit -m "chore: remove second one-shot DOCX branch sync"
          git push origin HEAD:hotfix/docx-mammoth-export-resolution
