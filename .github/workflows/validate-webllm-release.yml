name: Validate WebLLM Release

on:
  pull_request:
    paths:
      - "package.json"
      - "scripts/build-webllm.mjs"
      - "scripts/validate-webllm-browser-bundle.mjs"
      - "web/kairos-dashboard/vendor/webllm-entry.js"
      - "web/kairos-dashboard/vendor/node-url-browser-shim.js"
      - "web/kairos-dashboard/scripts/kairos-local-inference.js"
      - "web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js"
      - "web/kairos-dashboard/scripts/executive-local-inference.js"
      - "web/kairos-dashboard/index.html"
      - "backend-tests/kairos-local-inference-same-origin.test.ts"
      - "backend-tests/kairos-local-execution.test.ts"
      - ".github/workflows/validate-webllm-release.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "scripts/build-webllm.mjs"
      - "scripts/validate-webllm-browser-bundle.mjs"
      - "web/kairos-dashboard/vendor/webllm-entry.js"
      - "web/kairos-dashboard/vendor/node-url-browser-shim.js"
      - "web/kairos-dashboard/scripts/kairos-local-inference.js"
      - "web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js"
      - "web/kairos-dashboard/scripts/executive-local-inference.js"
      - "web/kairos-dashboard/index.html"
      - "backend-tests/kairos-local-inference-same-origin.test.ts"
      - "backend-tests/kairos-local-execution.test.ts"
      - ".github/workflows/validate-webllm-release.yml"

permissions:
  contents: read

jobs:
  verify-same-origin-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify WebLLM dependency is exactly pinned
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const version = pkg.dependencies?.["@mlc-ai/web-llm"];
          if (!/^\d+\.\d+\.\d+$/.test(String(version || ""))) {
            throw new Error(`@mlc-ai/web-llm must be pinned exactly; received ${version || "missing"}`);
          }
          if (version !== "0.2.82") {
            throw new Error(`Expected certified WebLLM 0.2.82; received ${version}`);
          }
          console.log(`Certified WebLLM version: ${version}`);
          NODE

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build and validate same-origin browser runtime
        run: |
          set -euo pipefail
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js
          node scripts/validate-webllm-browser-bundle.mjs

      - name: Verify local-only loading contract
        run: |
          set -euo pipefail
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          npx vitest run backend-tests/kairos-local-inference-same-origin.test.ts backend-tests/kairos-local-execution.test.ts
          grep -q '../vendor/webllm-bundle.js' web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          grep -q '../vendor/webllm-bundle.js' web/kairos-dashboard/scripts/executive-local-inference.js
          ! grep -R -n -E 'cdn\.jsdelivr\.net|esm\.run' \
            web/kairos-dashboard/scripts/kairos-local-inference.js \
            web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js \
            web/kairos-dashboard/scripts/executive-local-inference.js
