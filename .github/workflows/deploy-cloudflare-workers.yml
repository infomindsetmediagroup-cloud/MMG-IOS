name: Legacy Kairos Workers Check

# Production Worker deployment authority is exclusively owned by
# deploy-kairos-canonical-worker.yml. This legacy workflow is intentionally
# manual-only and non-deploying so it cannot race the canonical exact-SHA release.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairos-legacy-workers-check
  cancel-in-progress: true

jobs:
  retired:
    name: Confirm canonical Worker deployment ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify canonical workflow owns production
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-kairos-canonical-worker.yml
          grep -Fq 'name: Deploy Canonical Kairos Worker' .github/workflows/deploy-kairos-canonical-worker.yml
          grep -Fq 'npx wrangler deploy' .github/workflows/deploy-kairos-canonical-worker.yml
          echo 'Production Worker deployment is owned exclusively by deploy-kairos-canonical-worker.yml.'
          echo 'This legacy workflow performs no deployment.'
