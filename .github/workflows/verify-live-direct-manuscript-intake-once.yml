name: Verify Live Direct Manuscript Intake Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-direct-manuscript-intake-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report verification pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-live-direct-intake\",\"description\":\"Verifying live canonical manuscript intake\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Verify exact live canonical intake
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/live-direct-intake"
          mkdir -p "${work}"
          node <<'NODE' > "${work}/payload.json"
          const target = 279045;
          const seed = "Cinematic AI video creation, viral content systems, commercial prompt engineering, and modern AI filmmaking. ";
          const manuscript = seed.repeat(Math.ceil(target / seed.length)).slice(0, target);
          process.stdout.write(JSON.stringify({
            title: "AI Video Prompt Mastery Live Canonical Verification",
            manuscript,
            source: {
              projectId: `live-canonical-${process.env.GITHUB_RUN_ID}`,
              name: "AI-Video-Prompt-Mastery.docx",
              filename: "AI-Video-Prompt-Mastery.docx",
              format: "docx",
              size: 15728640,
              stored: true,
              uploadMode: "chunked-v1",
              checksum: "a".repeat(64)
            }
          }));
          NODE

          status="$(curl --silent --show-error --max-time 60 \
            -D "${work}/headers.txt" \
            -o "${work}/body.json" \
            -w '%{http_code}' \
            -X POST "${WORKER_URL}/api/manuscript/intake/advance" \
            -H 'Content-Type: application/json' \
            -H 'X-MMG-Client-Build: manuscript-studio-direct-chunks-20260730-4' \
            --data-binary "@${work}/payload.json")"

          echo "status=${status}"
          cat "${work}/headers.txt"
          cat "${work}/body.json"
          echo

          test "${status}" = "200"
          grep -qi 'x-kairos-canonical-local: kairos-local-canonical-entry-20260730-2-direct-intake' "${work}/headers.txt"
          grep -qi 'x-kairos-manuscript-studio: kairos-manuscript-studio-20260717-5' "${work}/headers.txt"
          grep -qi 'x-kairos-openai-calls: disabled' "${work}/headers.txt"
          grep -q '"status":"production_intake"' "${work}/body.json"
          grep -q '"characterCount":279045' "${work}/body.json"
          grep -q '"externalActionTaken":false' "${work}/body.json"

      - name: Report verification success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-live-direct-intake\",\"description\":\"Live canonical 279045-character intake passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report verification failure
        if: ${{ failure() }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-live-direct-intake\",\"description\":\"Live canonical manuscript intake failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
