name: Restore Certified Digital Asset V2 Implementation

on:
  push:
    branches:
      - fix/canonical-digital-asset-v2-20260805
    paths:
      - '.github/workflows/restore-certified-digital-asset-v2.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-digital-asset-v2-20260805
          fetch-depth: 0

      - name: Restore last certified standalone implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6767d12b926a53fd433ad214af58fadd9b2caea0 -- \
            cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js \
            cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js \
            web/kairos-dashboard/scripts/manuscript-project-setup.js \
            web/kairos-dashboard/scripts/manuscript-final-deliverable-engine.js

      - name: Validate restored sources
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          node --check web/kairos-dashboard/scripts/manuscript-project-setup.js
          node --check web/kairos-dashboard/scripts/manuscript-final-deliverable-engine.js
          ! grep -q 'kairos-manuscript-deliverables-builder-v3.js' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'mmg-digital-asset-edition-v2-customer-package-v1' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'packageFileCount: 6' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'MINIMUM_FINISHED_PAGES' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'canvaExcluded: true' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js

      - name: Remove temporary restore workflow
        run: rm -f .github/workflows/restore-certified-digital-asset-v2.yml

      - name: Commit restored implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore certified standalone Digital Asset Edition V2 engine'
          git push origin HEAD:fix/canonical-digital-asset-v2-20260805
