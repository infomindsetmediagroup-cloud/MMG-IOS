name: Validate Safari Chunked Source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-safari-chunked-source.yml'
      - '.github/workflows/deploy-sprint-44-revenue-storage.yml'
      - 'cloudflare/mmg-ios/src/kairos-manuscript-source-v1.js'
      - 'cloudflare/mmg-ios/src/kairos-production-registry-v1.js'
      - 'cloudflare/mmg-ios/test/kairos-manuscript-source-forwarding.test.js'
      - 'cloudflare/mmg-ios/test/kairos-manuscript-chunked-upload.test.js'
      - 'cloudflare/mmg-ios/scripts/validate-manuscript-large-intake.mjs'
      - 'web/kairos-dashboard/index.html'
      - 'web/kairos-dashboard/scripts/legacy-runtime-loader.js'
      - 'web/kairos-dashboard/scripts/manuscript-studio.js'
      - 'web/kairos-dashboard/scripts/manuscript-post-intake-guard.js'
      - 'web/kairos-dashboard/scripts/production-workspace-controller.js'
      - 'web/kairos-dashboard/scripts/kairos-state-fetch.js'
      - 'web/kairos-dashboard/scripts/kairos-state-fetch-install.js'
      - 'web/kairos-dashboard/scripts/manuscript-auto-pipeline.js'
      - 'web/kairos-dashboard/scripts/manuscript-production-flow-bootstrap.js'
      - 'browser-tests/manuscript-docx-native-extractor.spec.mjs'
      - 'browser-tests/manuscript-studio-direct-chunk.spec.mjs'
      - 'browser-tests/manuscript-post-intake-stability.spec.mjs'
      - 'tests/kairos-operational-execution-bridge.contract.test.js'
      - 'tests/manuscript-production-flow-guard.contract.test.js'
      - 'cloudflare/mmg-ios/test/kairos-manuscript-project-setup-ui-v2.test.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-chunked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate chunked source syntax and contracts
        run: |
          node --check cloudflare/mmg-ios/src/kairos-manuscript-source-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-registry-v1.js
          node --check web/kairos-dashboard/scripts/manuscript-studio.js
          node --check web/kairos-dashboard/scripts/manuscript-post-intake-guard.js
          node --check web/kairos-dashboard/scripts/production-workspace-controller.js
          node --check web/kairos-dashboard/scripts/legacy-runtime-loader.js
          node --check web/kairos-dashboard/scripts/kairos-state-fetch.js
          node --check web/kairos-dashboard/scripts/kairos-state-fetch-install.js
          node --check web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
          node --check web/kairos-dashboard/scripts/manuscript-production-flow-bootstrap.js
          node --check browser-tests/manuscript-post-intake-stability.spec.mjs
          node --test cloudflare/mmg-ios/test/kairos-manuscript-source-forwarding.test.js
          node --test cloudflare/mmg-ios/test/kairos-manuscript-chunked-upload.test.js
          node cloudflare/mmg-ios/scripts/validate-manuscript-large-intake.mjs
          node --test tests/kairos-operational-execution-bridge.contract.test.js
          node --test tests/manuscript-production-flow-guard.contract.test.js
          cd cloudflare/mmg-ios
          node --test test/kairos-manuscript-project-setup-ui-v2.test.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Verify direct Studio chunk storage and post-intake stability in iPhone WebKit
        run: |
          npx playwright test \
            browser-tests/manuscript-studio-direct-chunk.spec.mjs \
            browser-tests/manuscript-post-intake-stability.spec.mjs \
            --project=webkit \
            --workers=1

      - name: Enforce one authoritative non-multipart source and guarded local-production path
        run: |
          grep -q 'manuscript-studio-mobile-controls-20260803-2' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'chunkedSourceUpload: true' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'multipartSourceUpload: false' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'sourcePath(projectId, "session")' web/kairos-dashboard/scripts/manuscript-studio.js
          grep -q 'sourcePath(projectId, "commit")' web/kairos-dashboard/scripts/manuscript-studio.js
          ! grep -q 'new FormData' web/kairos-dashboard/scripts/manuscript-studio.js
          ! grep -q '"manuscript-docx-upload-hotfix.js"' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          grep -q 'five-center-dashboard-post-intake-stability-20260731-1' web/kairos-dashboard/index.html
          grep -q 'manuscript-post-intake-stability-20260731-1' web/kairos-dashboard/index.html
          grep -q 'const ASSET_RELEASE = "five-center-dashboard-post-intake-stability-20260731-1"' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          grep -q '"manuscript-post-intake-guard.js"' web/kairos-dashboard/scripts/legacy-runtime-loader.js
          grep -q 'duplicate Manuscript Studio module blocked' web/kairos-dashboard/scripts/manuscript-post-intake-guard.js
          grep -q 'success-overlay-restored' web/kairos-dashboard/scripts/manuscript-post-intake-guard.js
          grep -q 'Manuscript Studio exclusively owns the intake-to-registry transition' web/kairos-dashboard/scripts/production-workspace-controller.js
          ! sed -n '/async function captureProductionResponse/,/async function upsertWorkspaceRecord/p' web/kairos-dashboard/scripts/production-workspace-controller.js | grep -q '/api/manuscript/intake/advance'
          grep -q 'requestJSONWithRetry' web/kairos-dashboard/scripts/kairos-state-fetch.js
          grep -q 'KAIROS_STATE_TIMEOUT' web/kairos-dashboard/scripts/kairos-state-fetch.js
          grep -q 'data-start-local-production' web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
          grep -q 'KairosLocalInference' web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
          ! grep -q 'generation-job' web/kairos-dashboard/scripts/manuscript-auto-pipeline.js
