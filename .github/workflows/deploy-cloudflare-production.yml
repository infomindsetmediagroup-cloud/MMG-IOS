name: Legacy Cloudflare Production Check

# Production deployment authority has moved to deploy-kairos-canonical-worker.yml.
# This file is intentionally manual-only and non-deploying so an obsolete workflow
# cannot race, overwrite, or contradict the exact-SHA canonical Kairos deployment.
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kairos-legacy-cloudflare-check
  cancel-in-progress: true

jobs:
  retired:
    name: Confirm canonical deployment ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify canonical deployment workflow owns production
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/deploy-kairos-canonical-worker.yml
          grep -Fq 'name: Deploy Canonical Kairos Worker' .github/workflows/deploy-kairos-canonical-worker.yml
          grep -Fq 'npx wrangler deploy' .github/workflows/deploy-kairos-canonical-worker.yml
          echo 'Production deployment is owned exclusively by deploy-kairos-canonical-worker.yml.'
          echo 'This legacy workflow performs no deployment.'
