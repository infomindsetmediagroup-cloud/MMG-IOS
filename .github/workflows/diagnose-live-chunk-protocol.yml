name: Diagnose Live Chunk Protocol

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-chunk-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
    steps:
      - name: Verify exact live browser release
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/live-assets"
          mkdir -p "${root}"
          curl --fail --silent --show-error --max-time 30 "${WORKER_URL}/?release=1fd58bd335ba0fd03a42e119253389ef5d41caa5" -o "${root}/root.html"
          curl --fail --silent --show-error --max-time 30 "${WORKER_URL}/scripts/legacy-runtime-loader.js?release=1fd58bd335ba0fd03a42e119253389ef5d41caa5" -o "${root}/loader.js"
          curl --fail --silent --show-error --max-time 30 "${WORKER_URL}/scripts/manuscript-docx-upload-hotfix.js?release=1fd58bd335ba0fd03a42e119253389ef5d41caa5" -o "${root}/docx.js"
          curl --fail --silent --show-error --max-time 30 "${WORKER_URL}/scripts/command-hub.js?release=1fd58bd335ba0fd03a42e119253389ef5d41caa5" -o "${root}/command.js"
          parent_count="$(grep -o 'id: "\(knowledge\|content\|business\|customers\|operations\)"' "${root}/command.js" | wc -l | tr -d ' ')"
          echo "parent_count=${parent_count}"
          grep -n 'mmg-release' "${root}/root.html"
          grep -n 'ASSET_RELEASE' "${root}/loader.js" | head -10
          grep -n 'manuscript-docx-upload-hotfix-20260730-3-chunked-source' "${root}/docx.js"
          grep -n 'chunkedSourceUpload' "${root}/docx.js"
          grep -n 'FILE_CHUNK_BYTES' "${root}/docx.js" | head
          grep -n 'TEXT_CHUNK_BYTES' "${root}/docx.js" | head
          test "${parent_count}" = '5'
          grep -q 'five-center-dashboard-chunked-source-20260730-3' "${root}/root.html"
          grep -q 'const ASSET_RELEASE = "five-center-dashboard-chunked-source-20260730-3"' "${root}/loader.js"
          grep -q 'scripts/${filename}?v=${ASSET_RELEASE}' "${root}/loader.js"
          grep -q 'manuscript-docx-upload-hotfix-20260730-3-chunked-source' "${root}/docx.js"
          grep -q 'chunkedSourceUpload: true' "${root}/docx.js"
          grep -q 'FILE_CHUNK_BYTES = 512 \* 1024' "${root}/docx.js"
          grep -q 'TEXT_CHUNK_BYTES = 128 \* 1024' "${root}/docx.js"
          ! grep -q 'new FormData' "${root}/docx.js"

      - name: Print every live chunk protocol response
        shell: bash
        run: |
          set -uo pipefail
          root="${RUNNER_TEMP}/chunk-probe"
          mkdir -p "${root}"
          project_id="chunk-diag-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          upload_id="upload-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="${WORKER_URL}/api/production-registry/manuscripts/${project_id}/source"
          printf 'PK\003\004chunked-docx' > "${root}/source.bin"
          printf '%s' 'Kairos chunked live source verification.' > "${root}/text.bin"
          file_size="$(wc -c < "${root}/source.bin" | tr -d ' ')"
          text_size="$(wc -c < "${root}/text.bin" | tr -d ' ')"

          call() {
            name="$1"; shift
            status="$(curl --silent --show-error --max-time 60 -D "${root}/${name}.headers" -o "${root}/${name}.body" -w '%{http_code}' "$@" || echo curl-error)"
            echo "===== ${name} status=${status} ====="
            cat "${root}/${name}.headers" 2>/dev/null || true
            echo '--- body ---'
            cat "${root}/${name}.body" 2>/dev/null || true
            echo
            printf '%s' "${status}" > "${root}/${name}.status"
          }

          call session -X POST "${base}/session" \
            -H 'Content-Type: application/json' \
            --data "{\"uploadId\":\"${upload_id}\",\"title\":\"Live Chunk Diagnostic\",\"filename\":\"probe.docx\",\"format\":\"docx\",\"size\":${file_size},\"textBytes\":${text_size},\"fileChunks\":1,\"textChunks\":1}"
          call file -X PUT "${base}/file/0" \
            -H 'Content-Type: application/octet-stream' \
            -H "X-Kairos-Upload-Id: ${upload_id}" \
            --data-binary "@${root}/source.bin"
          call text -X PUT "${base}/text-chunk/0" \
            -H 'Content-Type: application/octet-stream' \
            -H "X-Kairos-Upload-Id: ${upload_id}" \
            --data-binary "@${root}/text.bin"
          call commit -X POST "${base}/commit" \
            -H 'Content-Type: application/json' \
            -H "X-Kairos-Upload-Id: ${upload_id}" \
            --data "{\"uploadId\":\"${upload_id}\"}"
          call read "${base}/text"
          call cleanup -X DELETE "${base}"

          echo '===== summary ====='
          for name in session file text commit read cleanup; do
            echo "${name}=$(cat "${root}/${name}.status")"
          done
          test "$(cat "${root}/session.status")" = '201'
          test "$(cat "${root}/file.status")" = '201'
          test "$(cat "${root}/text.status")" = '201'
          test "$(cat "${root}/commit.status")" = '201'
          test "$(cat "${root}/read.status")" = '200'
          test "$(cat "${root}/cleanup.status")" = '200'
