name: Repair Live Manuscript Setup Verifier Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-and-probe-manuscript-setup-main-once.yml'

permissions:
  contents: write

jobs:
  repair-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace indented heredoc
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-sprint-44-revenue-storage.yml')
          source = path.read_text()
          start_marker = '              cat > "${work}/setup.json" <<JSON\n'
          end_marker = '              JSON\n'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Setup JSON heredoc start was not found.')
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Setup JSON heredoc end was not found.')
          end += len(end_marker)
          replacement = (
              '              printf \'%s\' "{\\"authorName\\":\\"MMG Runtime Diagnostic\\",'
              '\\"publicationTitle\\":\\"Live Manuscript Setup Diagnostic\\",'
              '\\"service\\":\\"complete-publishing-package\\",'
              '\\"edition\\":\\"multi-format\\",'
              '\\"trimSize\\":\\"6x9\\",'
              '\\"isbnStatus\\":\\"not-decided\\",'
              '\\"notes\\":\\"Bounded route verification only.\\",'
              '\\"operationId\\":\\"${operation_id}\\"}" > "${work}/setup.json"\n'
          )
          source = source[:start] + replacement + source[end:]
          path.write_text(source)
          PY

          ! grep -q '<<JSON' .github/workflows/deploy-sprint-44-revenue-storage.yml
          grep -q 'operationId.*operation_id' .github/workflows/deploy-sprint-44-revenue-storage.yml

      - name: Commit verifier correction
        run: |
          git config user.name "kairos-ci"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/deploy-sprint-44-revenue-storage.yml
          git commit -m "ci: repair live manuscript setup verifier"
          git push origin HEAD:main
