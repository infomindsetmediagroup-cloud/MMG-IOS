name: Diagnose Kairos Local Live

on:
  push:
    branches:
      - agent/kairos-local-live-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
    steps:
      - name: Diagnose every live verification condition
        run: |
          set -u
          root="${RUNNER_TEMP}/root.html"
          loader="${RUNNER_TEMP}/runtime-loader.js"
          bridge="${RUNNER_TEMP}/local-bridge.js"
          inference="${RUNNER_TEMP}/local-inference.js"
          bundle="${RUNNER_TEMP}/webllm-bundle.js"
          readiness="${RUNNER_TEMP}/readiness.json"
          workflows="${RUNNER_TEMP}/workflows.json"
          api_denial="${RUNNER_TEMP}/api-denial.json"
          manuscript_denial="${RUNNER_TEMP}/manuscript-denial.json"
          revenue_denial="${RUNNER_TEMP}/revenue-denial.json"
          shopify_denial="${RUNNER_TEMP}/shopify-denial.json"
          safari="${RUNNER_TEMP}/safari.js"
          docx="${RUNNER_TEMP}/docx.js"

          root_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?diagnostic=${GITHUB_SHA}" -o "${root}" -w '%{http_code}' || true)"
          loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-runtime-loader.js?diagnostic=${GITHUB_SHA}" -o "${loader}" -w '%{http_code}' || true)"
          bridge_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-local-inference.js?diagnostic=${GITHUB_SHA}" -o "${bridge}" -w '%{http_code}' || true)"
          inference_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-local-inference-same-origin.js?diagnostic=${GITHUB_SHA}" -o "${inference}" -w '%{http_code}' || true)"
          bundle_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/vendor/webllm-bundle.js?diagnostic=${GITHUB_SHA}" -o "${bundle}" -w '%{http_code}' || true)"
          readiness_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/operational-readiness?diagnostic=${GITHUB_SHA}" -o "${readiness}" -w '%{http_code}' || true)"
          workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?diagnostic=${GITHUB_SHA}" -o "${workflows}" -w '%{http_code}' || true)"
          api_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${api_denial}" -w '%{http_code}' || true)"
          manuscript_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/production-registry/manuscripts/test-project-12345678/generation-job" -H 'Content-Type: application/json' --data '{}' -o "${manuscript_denial}" -w '%{http_code}' || true)"
          revenue_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos/revenue/execute-content-batch" -H 'Content-Type: application/json' --data '{}' -o "${revenue_denial}" -w '%{http_code}' || true)"
          shopify_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/shopify/page-shell/publish" -H 'Content-Type: application/json' --data '{}' -o "${shopify_denial}" -w '%{http_code}' || true)"
          safari_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/safari-manuscript-intake-compat.js?v=safari-docx-export-resolver-20260730-1" -o "${safari}" -w '%{http_code}' || true)"
          docx_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/manuscript-docx-upload-hotfix.js?v=manuscript-docx-export-resolver-20260730-1" -o "${docx}" -w '%{http_code}' || true)"

          check() { if "$@"; then echo "PASS $*"; else echo "FAIL $*"; fi; }
          echo "STATUSES root=${root_status} loader=${loader_status} bridge=${bridge_status} inference=${inference_status} bundle=${bundle_status} readiness=${readiness_status} workflows=${workflows_status} api=${api_denial_status} manuscript=${manuscript_denial_status} revenue=${revenue_denial_status} shopify=${shopify_denial_status} safari=${safari_status} docx=${docx_status}"
          echo "SIZES root=$(wc -c < "${root}") loader=$(wc -c < "${loader}") bridge=$(wc -c < "${bridge}") inference=$(wc -c < "${inference}") bundle=$(wc -c < "${bundle}") workflows=$(wc -c < "${workflows}")"
          echo "MODULE_COUNT $(grep -o '<script type=\"module\"' "${root}" | wc -l | tr -d ' ')"
          check grep -q 'kairos-executive-local-inference-20260730-1' "${root}"
          check grep -q 'kairos-runtime-loader.js' "${root}"
          check grep -q 'legacy-runtime-loader.js' "${loader}"
          check grep -q 'executive-local-inference.js' "${loader}"
          check grep -q 'browser-webgpu' "${bridge}"
          check grep -q '../vendor/webllm-bundle.js' "${bridge}"
          check grep -q '../vendor/webllm-bundle.js' "${inference}"
          check grep -q 'CreateMLCEngine' "${bundle}"
          check grep -q '"ready":true' "${readiness}"
          check grep -q '"provider":"browser-webgpu"' "${readiness}"
          check grep -q '"externalPaidAPIUsed":false' "${readiness}"
          check grep -q '"backendProviderCalls":false' "${readiness}"
          check grep -q '"cloudflareNeuronsUsed":0' "${readiness}"
          check grep -q '"status":"ready"' "${workflows}"
          check grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${api_denial}"
          check grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${manuscript_denial}"
          check grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${revenue_denial}"
          check grep -q '"code":"WEBSITE_MUTATION_DENIED"' "${shopify_denial}"
          check grep -q 'safari-manuscript-intake-compat-20260730-11-docx' "${safari}"
          check grep -q 'manuscript-docx-upload-hotfix-20260730-1' "${docx}"
          echo '--- WORKFLOWS ---'
          cat "${workflows}"
