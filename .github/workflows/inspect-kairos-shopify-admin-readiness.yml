name: Inspect Kairos Shopify Admin Readiness

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-kairos-shopify-admin-readiness.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev

    steps:
      - name: Require Cloudflare inspection credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Inspect Worker binding names without values
        run: |
          set -euo pipefail
          settings="${RUNNER_TEMP}/worker-settings.json"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/mmg-ios/settings" \
            -o "${settings}"
          jq -e '.success == true' "${settings}" >/dev/null
          jq -r '.result.bindings[]? | [.name, .type] | @tsv' "${settings}" \
            | sort \
            | tee "${RUNNER_TEMP}/worker-binding-names.tsv"

      - name: Inspect live Shopify analytics credential selection
        run: |
          set -euo pipefail
          analytics="${RUNNER_TEMP}/shopify-analytics.json"
          code="$(curl --silent --show-error --max-time 45 \
            "${WORKER_URL}/api/analytics/shopify?readiness=${GITHUB_SHA}" \
            -o "${analytics}" \
            -w '%{http_code}')"
          test "${code}" = "200"
          jq '{status, source, credentialPath, build, requirements, authorization: {scopeInspectionStatus: .authorization.scopeInspectionStatus, readReportsGranted: .authorization.readReportsGranted, shopifyQLVerified: .authorization.shopifyQLVerified}}' \
            "${analytics}" | tee "${RUNNER_TEMP}/shopify-credential-selection.json"

      - name: Inspect embedded dashboard bootstrap boundary
        run: |
          set -euo pipefail
          host="$(printf '%s' 'admin.shopify.com/store/07kd8e-qw' | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          headers="${RUNNER_TEMP}/dashboard-bootstrap.headers"
          body="${RUNNER_TEMP}/dashboard-bootstrap.body"
          code="$(curl --silent --show-error --max-time 45 \
            -D "${headers}" \
            "${WORKER_URL}/app?shop=07kd8e-qw.myshopify.com&host=${host}" \
            -o "${body}" \
            -w '%{http_code}')"
          printf 'HTTP %s\n' "${code}"
          tr -d '\r' < "${headers}" | grep -Ei '^(content-type|x-kairos|cache-control|content-security-policy):' || true
          case "${code}" in
            200|401|403|503) ;;
            *) cat "${body}"; exit 1 ;;
          esac
          printf '%s' "${code}" > "${RUNNER_TEMP}/dashboard-bootstrap-status.txt"

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-shopify-admin-readiness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worker-binding-names.tsv
            ${{ runner.temp }}/shopify-credential-selection.json
            ${{ runner.temp }}/dashboard-bootstrap.headers
            ${{ runner.temp }}/dashboard-bootstrap-status.txt
          if-no-files-found: warn
          retention-days: 7
