name: Retired Legacy Shopify Publisher

# This workflow previously deployed the retired native-main-menu Worker on every
# main push. That deployment raced the canonical Kairos Worker and could replace
# the active manuscript runtime after a successful canonical deployment.
#
# Shopify navigation publication is intentionally disconnected from Worker
# deployment. The canonical Worker is deployed only by
# deploy-kairos-canonical-worker.yml.

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy publisher is retired
        run: |
          echo "This legacy Worker and Shopify publisher is retired."
          echo "Use the governed Shopify release workflows for navigation or page-shell work."
          echo "Use deploy-kairos-canonical-worker.yml for Kairos Worker deployment."
