name: Disable Cloudflare Workers Builds Production Trigger

# One-time control-plane migration. This workflow removes only the Cloudflare
# Workers Builds trigger that promotes the mmg-ios production branch. Preview
# builds remain untouched. GitHub Actions then remains the production deploy owner.
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/disable-cloudflare-workers-builds-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disable-cloudflare-workers-builds-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 9f81b4b13a3053004c105ccc9e3de67b
  EXPECTED_REPOSITORY: MMG-IOS
  PRODUCTION_BRANCH: main
  DISCOVERY_BUILD_UUID: 0218d957-7b00-44fa-8486-6e30e4316f55

jobs:
  disable-production-trigger:
    name: Disable Workers Builds production trigger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve guarded production trigger from known main build
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is unavailable." >&2; exit 1; }

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl --fail-with-body --silent --show-error \
            -H "${auth}" \
            "${api}/builds/builds/${DISCOVERY_BUILD_UUID}" > /tmp/build.json
          jq -e '.success == true' /tmp/build.json > /dev/null

          jq -e --arg branch "${PRODUCTION_BRANCH}" --arg repo "${EXPECTED_REPOSITORY}" '
            .result.build_trigger_metadata.branch == $branch
            and .result.build_trigger_metadata.repo_name == $repo
            and .result.build_trigger_metadata.build_trigger_source == "push"
            and ((.result.trigger.branch_includes // []) | index($branch))
            and .result.trigger.trigger_uuid != null
            and .result.trigger.external_script_id != null
          ' /tmp/build.json > /dev/null || {
            echo "Refusing to mutate Cloudflare: discovery build does not match the guarded MMG-IOS main production trigger." >&2
            jq '{branch:.result.build_trigger_metadata.branch,repo:.result.build_trigger_metadata.repo_name,source:.result.build_trigger_metadata.build_trigger_source,trigger:.result.trigger}' /tmp/build.json >&2
            exit 1
          }

          jq '{branch:.result.build_trigger_metadata.branch,repo:.result.build_trigger_metadata.repo_name,source:.result.build_trigger_metadata.build_trigger_source,trigger_uuid:.result.trigger.trigger_uuid,external_script_id:.result.trigger.external_script_id,branch_includes:.result.trigger.branch_includes,branch_excludes:.result.trigger.branch_excludes,deploy_command:.result.trigger.deploy_command}' /tmp/build.json

          trigger_uuid="$(jq -r '.result.trigger.trigger_uuid' /tmp/build.json)"
          worker_tag="$(jq -r '.result.trigger.external_script_id' /tmp/build.json)"
          test -n "${trigger_uuid}" && test "${trigger_uuid}" != "null"
          test -n "${worker_tag}" && test "${worker_tag}" != "null"

          echo "trigger_uuid=${trigger_uuid}" >> "${GITHUB_OUTPUT}"
          echo "worker_tag=${worker_tag}" >> "${GITHUB_OUTPUT}"

      - name: Delete guarded production trigger
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          response="$(curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/builds/triggers/${{ steps.resolve.outputs.trigger_uuid }}")"
          printf '%s' "${response}" | jq -e '.success == true' > /dev/null
          echo "Cloudflare Workers Builds production trigger deleted."

      - name: Verify production trigger is absent
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}/builds/workers/${{ steps.resolve.outputs.worker_tag }}/triggers" > /tmp/triggers-after.json
          jq -e '.success == true' /tmp/triggers-after.json > /dev/null

          remaining="$(jq --arg branch "${PRODUCTION_BRANCH}" --arg repo "${EXPECTED_REPOSITORY}" '[
            .result[]
            | select((.branch_includes // []) | index($branch))
            | select((.repo_connection.repo_name // "") == $repo)
          ] | length' /tmp/triggers-after.json)"
          test "${remaining}" = "0" || { echo "Production trigger still exists after deletion." >&2; exit 1; }
          echo "Verified: Cloudflare Workers Builds no longer owns ${EXPECTED_REPOSITORY}:${PRODUCTION_BRANCH} production deployment."
