name: Provision Kairos Customer Assets

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-kairos-customer-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-kairos-customer-assets
  cancel-in-progress: false

jobs:
  provision:
    name: Provision private customer asset storage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CUSTOMER_ASSET_BUCKET: mmg-customer-assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Ensure private R2 bucket exists
        working-directory: cloudflare/mmg-ios
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list 2>&1 | tee "${RUNNER_TEMP}/r2-before.txt" | grep -Fq "${CUSTOMER_ASSET_BUCKET}"; then
            echo "Customer asset bucket already exists."
          else
            npx wrangler r2 bucket create "${CUSTOMER_ASSET_BUCKET}"
          fi

      - name: Verify private R2 bucket
        working-directory: cloudflare/mmg-ios
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 bucket list 2>&1 | tee "${RUNNER_TEMP}/r2-after.txt"
          grep -Fq "${CUSTOMER_ASSET_BUCKET}" "${RUNNER_TEMP}/r2-after.txt"
          echo "Verified private customer asset bucket: ${CUSTOMER_ASSET_BUCKET}"
