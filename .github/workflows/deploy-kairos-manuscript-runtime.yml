name: Deploy Kairos Local Manuscript Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY KAIROS LOCAL RUNTIME to authorize production deployment.'
        required: true
        type: string
      release_id:
        description: 'Human-readable production release identifier.'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-local-manuscript-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY KAIROS LOCAL RUNTIME' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      KAIROS_RELEASE_ID: ${{ inputs.release_id }}

    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-local-runtime\",\"description\":\"Validating local-only production release ${KAIROS_RELEASE_ID}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build same-origin WebLLM runtime
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js

      - name: Validate local-only runtime syntax
        run: |
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js

      - name: Validate local-only inference contracts
        run: |
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_NO_COST_MODE = "true"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_LOCAL_INFERENCE_ENABLED = "true"' cloudflare/mmg-ios/wrangler.toml
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          ! grep -q 'cdn.jsdelivr.net' web/kairos-dashboard/scripts/executive-local-inference.js
          ! grep -q 'esm.run' web/kairos-dashboard/scripts/executive-local-inference.js

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy local-only manuscript Worker
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify local operational readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="${RUNNER_TEMP}/local-readiness.json"
            status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/operational-readiness?release=${KAIROS_RELEASE_ID}&attempt=${attempt}" -o "${body}" -w '%{http_code}' || true)"
            if [ "${status}" = "200" ] \
              && grep -q '"ready":true' "${body}" \
              && grep -q '"provider":"browser-webgpu"' "${body}" \
              && grep -q '"externalPaidAPIUsed":false' "${body}" \
              && grep -q '"backendProviderCalls":false' "${body}" \
              && grep -q '"cloudflareNeuronsUsed":0' "${body}"; then
              cat "${body}"
              break
            fi
            if [ "${attempt}" = "30" ]; then cat "${body}" || true; exit 1; fi
            sleep 5
          done

      - name: Verify local browser runtime deployed
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/root.html"
          bridge="${RUNNER_TEMP}/executive-local-inference.js"
          inference="${RUNNER_TEMP}/kairos-local-inference-same-origin.js"
          bundle="${RUNNER_TEMP}/webllm-bundle.js"
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --max-time 20 "${WORKER_URL}/?verify=${GITHUB_SHA}&attempt=${attempt}" -o "${root}" || true
            curl --fail --silent --show-error --max-time 20 "${WORKER_URL}/scripts/executive-local-inference.js?verify=${GITHUB_SHA}&attempt=${attempt}" -o "${bridge}" || true
            curl --fail --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-local-inference-same-origin.js?verify=${GITHUB_SHA}&attempt=${attempt}" -o "${inference}" || true
            curl --fail --silent --show-error --max-time 20 "${WORKER_URL}/vendor/webllm-bundle.js?verify=${GITHUB_SHA}&attempt=${attempt}" -o "${bundle}" || true
            if grep -q 'executive-local-inference.js' "${root}" \
              && grep -q 'browser-webgpu' "${bridge}" \
              && grep -q '../vendor/webllm-bundle.js' "${inference}" \
              && grep -q 'CreateMLCEngine' "${bundle}"; then
              break
            fi
            if [ "${attempt}" = "30" ]; then echo "Local browser inference assets did not propagate completely."; exit 1; fi
            sleep 5
          done

      - name: Verify external provider generation is disabled
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/provider-disabled.json"
          status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${body}" -w '%{http_code}' || true)"
          cat "${body}"
          test "${status}" = "409"
          grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${body}"

      - name: Verify direct website mutation firewall
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/shopify-denial.json"
          status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/shopify/page-shell/publish" -H 'Content-Type: application/json' --data '{}' -o "${body}" -w '%{http_code}' || true)"
          cat "${body}"
          test "${status}" = "403"
          grep -q '"code":"WEBSITE_MUTATION_DENIED"' "${body}"

      - name: Report deployment success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-local-runtime\",\"description\":\"Local-only production release ${KAIROS_RELEASE_ID} passed all gates\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-local-runtime\",\"description\":\"Local-only production release ${KAIROS_RELEASE_ID} failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
