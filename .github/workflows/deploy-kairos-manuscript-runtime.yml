name: Deploy Kairos Local Manuscript Runtime

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY KAIROS LOCAL RUNTIME to authorize production deployment.'
        required: true
        type: string
      release_id:
        description: 'Human-readable production release identifier.'
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-kairos-local-manuscript-runtime-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY KAIROS LOCAL RUNTIME' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      KAIROS_RELEASE_ID: ${{ inputs.release_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Mark deployment pending
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-local-runtime\",\"description\":\"Validating canonical local-only release ${KAIROS_RELEASE_ID}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install validation dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Build and validate local inference
        run: |
          npm run build:webllm
          test -s web/kairos-dashboard/vendor/webllm-bundle.js
          grep -q 'CreateMLCEngine' web/kairos-dashboard/vendor/webllm-bundle.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js
          node --check cloudflare/mmg-ios/src/kairos-production-entry-local-execution-v1.js
          node --check web/kairos-dashboard/scripts/kairos-runtime-loader.js
          node --check web/kairos-dashboard/scripts/executive-local-inference.js
          node --check web/kairos-dashboard/scripts/kairos-local-inference-same-origin.js
          npx vitest run backend-tests/kairos-local-execution.test.ts backend-tests/kairos-local-inference-same-origin.test.ts
          grep -q 'main = "src/kairos-production-entry-local-canonical-v1.js"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_MODEL_PROVIDER = "browser-webgpu"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'KAIROS_NO_COST_MODE = "true"' cloudflare/mmg-ios/wrangler.toml
          grep -q 'OPENAI_API_KEY.*return ""' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          grep -q 'kairos-local-readiness-sentinel-not-a-provider-key' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          ! grep -q 'api.openai.com' cloudflare/mmg-ios/src/kairos-production-entry-local-only-v1.js

      - name: Install Worker dependencies
        working-directory: cloudflare/mmg-ios
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund > /dev/null

      - name: Validate Worker bundle
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy --dry-run

      - name: Deploy local-only Worker
        working-directory: cloudflare/mmg-ios
        run: npx wrangler deploy

      - name: Verify production boundary
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            readiness="${RUNNER_TEMP}/readiness.json"
            workflows="${RUNNER_TEMP}/workflows.json"
            api_denial="${RUNNER_TEMP}/api-denial.json"
            manuscript_denial="${RUNNER_TEMP}/manuscript-denial.json"
            revenue_denial="${RUNNER_TEMP}/revenue-denial.json"
            root="${RUNNER_TEMP}/root.html"
            loader="${RUNNER_TEMP}/loader.js"
            bundle="${RUNNER_TEMP}/bundle.js"
            headers="${RUNNER_TEMP}/headers.txt"

            readiness_status="$(curl --silent --show-error --max-time 20 -D "${headers}" "${WORKER_URL}/api/operational-readiness?release=${KAIROS_RELEASE_ID}&attempt=${attempt}" -o "${readiness}" -w '%{http_code}' || true)"
            workflows_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/api/workflows?release=${KAIROS_RELEASE_ID}&attempt=${attempt}" -o "${workflows}" -w '%{http_code}' || true)"
            api_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos" -H 'Content-Type: application/json' --data '{"objective":"provider denial probe"}' -o "${api_denial}" -w '%{http_code}' || true)"
            manuscript_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/production-registry/manuscripts/test-project-12345678/generation-job" -H 'Content-Type: application/json' --data '{}' -o "${manuscript_denial}" -w '%{http_code}' || true)"
            revenue_denial_status="$(curl --silent --show-error --max-time 20 -X POST "${WORKER_URL}/api/kairos/revenue/execute-content-batch" -H 'Content-Type: application/json' --data '{}' -o "${revenue_denial}" -w '%{http_code}' || true)"
            root_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/?release=${GITHUB_SHA}&attempt=${attempt}" -o "${root}" -w '%{http_code}' || true)"
            loader_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/scripts/kairos-runtime-loader.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${loader}" -w '%{http_code}' || true)"
            bundle_status="$(curl --silent --show-error --max-time 20 "${WORKER_URL}/vendor/webllm-bundle.js?release=${GITHUB_SHA}&attempt=${attempt}" -o "${bundle}" -w '%{http_code}' || true)"
            module_count="$(grep -o '<script type="module"' "${root}" | wc -l | tr -d ' ')"

            if [ "${readiness_status}" = "200" ] \
              && grep -qi 'x-kairos-canonical-local: kairos-local-canonical-entry-20260730-1' "${headers}" \
              && grep -qi 'x-kairos-openai-calls: disabled' "${headers}" \
              && grep -q '"ready":true' "${readiness}" \
              && grep -q '"provider":"browser-webgpu"' "${readiness}" \
              && grep -q '"backendProviderCalls":false' "${readiness}" \
              && grep -q '"externalPaidAPIUsed":false' "${readiness}" \
              && grep -q '"cloudflareNeuronsUsed":0' "${readiness}" \
              && [ "${workflows_status}" = "200" ] \
              && grep -q '"status":"ready"' "${workflows}" \
              && [ "${api_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${api_denial}" \
              && [ "${manuscript_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${manuscript_denial}" \
              && [ "${revenue_denial_status}" = "409" ] \
              && grep -q '"code":"LOCAL_INFERENCE_REQUIRED"' "${revenue_denial}" \
              && [ "${root_status}" = "200" ] \
              && [ "${module_count}" = "2" ] \
              && grep -q 'kairos-runtime-loader.js' "${root}" \
              && [ "${loader_status}" = "200" ] \
              && grep -q 'executive-local-inference.js' "${loader}" \
              && [ "${bundle_status}" = "200" ] \
              && grep -q 'CreateMLCEngine' "${bundle}"; then
              cat "${readiness}"
              cat "${workflows}"
              exit 0
            fi

            if [ "${attempt}" = "30" ]; then
              printf 'readiness=%s workflows=%s api=%s manuscript=%s revenue=%s root=%s loader=%s bundle=%s\n' \
                "${readiness_status}" "${workflows_status}" "${api_denial_status}" "${manuscript_denial_status}" "${revenue_denial_status}" "${root_status}" "${loader_status}" "${bundle_status}"
              cat "${headers}" || true
              cat "${readiness}" || true
              cat "${workflows}" || true
              cat "${api_denial}" || true
              cat "${manuscript_denial}" || true
              cat "${revenue_denial}" || true
              exit 1
            fi
            sleep 5
          done

      - name: Report deployment success
        if: ${{ success() }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-local-runtime\",\"description\":\"Canonical local-only release ${KAIROS_RELEASE_ID} passed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report deployment failure
        if: ${{ failure() || cancelled() }}
        run: |
          curl --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-local-runtime\",\"description\":\"Canonical local-only release ${KAIROS_RELEASE_ID} failed\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true
