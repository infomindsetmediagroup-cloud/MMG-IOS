name: Finalize Canonical Kairos Worker After Cloudflare Builds

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: kairos-production-finalizer
  cancel-in-progress: true

env:
  WORKER_DIRECTORY: cloudflare/mmg-ios
  WORKER_BASE_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
  CANONICAL_ENTRY_BUILD: kairos-local-canonical-entry-20260807-2-customer-account-oauth
  CUSTOMER_AUTH_BUILD: kairos-customer-account-auth-20260807-1-confidential-session
  MANUSCRIPT_IDENTITY_BUILD: kairos-manuscript-canonical-identity-20260804-1-server-shard-resolution

jobs:
  finalize:
    name: Preserve canonical Worker as final production writer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Re-run Customer Portal security gate
        run: npx vitest run backend-tests/kairos-customer-account-auth.test.ts backend-tests/kairos-customer-runtime-projection-store.test.ts backend-tests/kairos-customer-runtime-projection.test.ts backend-tests/kairos-customer-runtime-actions.test.ts

      - name: Install Worker dependencies
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Validate exact Worker bundle
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: npx wrangler deploy --dry-run

      - name: Wait for external Cloudflare Workers Build to finish
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          found=""
          for attempt in $(seq 1 60); do
            payload="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}")"
            found="$(printf '%s' "${payload}" | jq -c '[.check_runs[] | select(.name == "Workers Builds: mmg-ios" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last // empty')"
            if [ -n "${found}" ]; then
              echo "Observed Cloudflare Workers Build for ${GITHUB_SHA}."
              break
            fi
            echo "Cloudflare Workers Build has not appeared yet (${attempt}/60)."
            sleep 5
          done

          if [ -z "${found}" ]; then
            echo "No Cloudflare Workers Build appeared in the guarded observation window. Continuing with canonical final deployment."
            exit 0
          fi

          for attempt in $(seq 1 240); do
            payload="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}")"
            row="$(printf '%s' "${payload}" | jq -c '[.check_runs[] | select(.name == "Workers Builds: mmg-ios" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last // empty')"
            status="$(printf '%s' "${row}" | jq -r '.status // empty')"
            conclusion="$(printf '%s' "${row}" | jq -r '.conclusion // empty')"
            echo "Cloudflare Workers Build status: ${status:-unknown} ${conclusion:-} (${attempt}/240)."
            if [ "${status}" = "completed" ]; then
              echo "External Cloudflare writer has finished. Canonical GitHub deployment will now be the final writer."
              exit 0
            fi
            sleep 5
          done

          echo "Cloudflare Workers Build did not complete inside the guarded window; refusing to claim a stable final deployment." >&2
          exit 1

      - name: Deploy exact canonical Kairos Worker last
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var "DEPLOYMENT_SHA:${GITHUB_SHA}" \
            --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify final exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="${RUNNER_TEMP}/final-deployment-identity-${attempt}.json"
            headers="${RUNNER_TEMP}/final-deployment-identity-${attempt}.headers"
            status="$(curl --silent --show-error --max-time 30 \
              -D "${headers}" \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${WORKER_BASE_URL}/api/deployment/identity?sha=${GITHUB_SHA}&finalizer=${attempt}" \
              -o "${body}" -w '%{http_code}' || true)"
            echo "Final deployment verification ${attempt}/24 HTTP ${status}"
            cat "${body}" || true
            if [ "${status}" = "200" ] \
              && grep -Fq "\"deploymentSha\":\"${GITHUB_SHA}\"" "${body}" \
              && grep -qi "x-kairos-canonical-local: ${CANONICAL_ENTRY_BUILD}" "${headers}" \
              && grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}" \
              && grep -qi "x-kairos-manuscript-identity-build: ${MANUSCRIPT_IDENTITY_BUILD}" "${headers}"; then
              echo "Verified exact canonical Worker as final production deployment."
              exit 0
            fi
            sleep 5
          done
          echo "Final exact canonical Worker deployment could not be verified." >&2
          exit 1

      - name: Verify final Customer Portal OAuth boundary
        shell: bash
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/final-customer-oauth.headers"
          body="${RUNNER_TEMP}/final-customer-oauth.body"
          status="$(curl --silent --show-error --max-time 30 \
            -D "${headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/api/customer/auth/start?verify=${GITHUB_SHA}&finalizer=1" \
            -o "${body}" -w '%{http_code}')"
          echo "Final Customer OAuth entrypoint HTTP ${status}"
          test "${status}" = "302"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "${headers}")"
          test -n "${location}"
          printf '%s\n' "${location}" | grep -Fq 'client_id=0de689abad167c3e9b4197728bfd6b55'
          printf '%s\n' "${location}" | grep -Fq 'redirect_uri=https%3A%2F%2Fmmg-ios.info-mindsetmediagroup.workers.dev%2Fapi%2Fcustomer%2Fauth%2Fcallback'
          printf '%s\n' "${location}" | grep -Fq 'response_type=code'

          portal_headers="${RUNNER_TEMP}/final-customer-portal.headers"
          portal_status="$(curl --silent --show-error --max-time 30 \
            -D "${portal_headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/customer-portal?verify=${GITHUB_SHA}&finalizer=1" \
            -o /dev/null -w '%{http_code}')"
          echo "Final unauthenticated secure portal boundary HTTP ${portal_status}"
          test "${portal_status}" = "302"
          grep -qi "location: ${WORKER_BASE_URL}/api/customer/auth/start" "${portal_headers}"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${portal_headers}"
          echo "Verified final Shopify Customer Account OAuth entrypoint and protected portal boundary."
