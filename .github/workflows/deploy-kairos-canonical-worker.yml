name: Deploy Canonical Kairos Worker

"on":
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/mmg-ios/**"
      - "web/kairos-dashboard/**"
      - "backend-tests/kairos-customer-*.test.ts"
      - "browser-tests/manuscript-pipeline-orchestrator.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-kairos-canonical-worker.yml"
      - ".github/workflows/deploy-cloudflare-production.yml"
      - ".github/workflows/deploy-cloudflare-workers.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/mmg-ios/**"
      - "web/kairos-dashboard/**"
      - "backend-tests/kairos-customer-*.test.ts"
      - "browser-tests/manuscript-pipeline-orchestrator.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-kairos-canonical-worker.yml"
      - ".github/workflows/deploy-cloudflare-production.yml"
      - ".github/workflows/deploy-cloudflare-workers.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: kairos-canonical-worker-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKER_DIRECTORY: cloudflare/mmg-ios
  WORKER_BASE_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
  CANONICAL_ENTRY_BUILD: kairos-local-canonical-entry-20260807-2-customer-account-oauth
  CUSTOMER_AUTH_BUILD: kairos-customer-account-auth-20260807-1-confidential-session
  PUBLISHING_ENTRY_BUILD: kairos-canonical-publishing-entry-20260808-4-visual-standard
  MANUSCRIPT_IDENTITY_BUILD: kairos-manuscript-canonical-identity-20260804-1-server-shard-resolution
  DIGITAL_ASSET_PACKAGE_CONTRACT: mmg-digital-asset-edition-v2-customer-package-v1

jobs:
  validate:
    name: Validate canonical Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install repository dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Enforce Digital Asset Edition V2 governance
        shell: bash
        run: |
          set -euxo pipefail
          test -e .github/workflows/deploy-kairos-manuscript-runtime.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-kairos-manuscript-runtime.yml
          ! grep -Eq '^[[:space:]]{2}push:' .github/workflows/deploy-kairos-manuscript-runtime.yml
          grep -Fq "github.ref == 'refs/heads/main'" .github/workflows/deploy-kairos-manuscript-runtime.yml

          test -e .github/workflows/deploy-cloudflare-production.yml
          grep -Fq 'name: Legacy Cloudflare Production Check' .github/workflows/deploy-cloudflare-production.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-cloudflare-production.yml
          ! grep -Eq '^[[:space:]]{2}push:' .github/workflows/deploy-cloudflare-production.yml
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-cloudflare-production.yml
          ! grep -Fq 'environment: production' .github/workflows/deploy-cloudflare-production.yml

          test -e .github/workflows/deploy-cloudflare-workers.yml
          grep -Fq 'name: Legacy Kairos Workers Check' .github/workflows/deploy-cloudflare-workers.yml
          grep -Fq 'workflow_dispatch:' .github/workflows/deploy-cloudflare-workers.yml
          ! grep -Eq '^[[:space:]]{2}push:' .github/workflows/deploy-cloudflare-workers.yml
          ! grep -Eq '^[[:space:]]{2}workflow_run:' .github/workflows/deploy-cloudflare-workers.yml
          ! grep -Fq 'cloudflare/wrangler-action@' .github/workflows/deploy-cloudflare-workers.yml
          ! grep -Fq 'CLOUDFLARE_API_TOKEN' .github/workflows/deploy-cloudflare-workers.yml
          ! grep -Fq 'environment: production' .github/workflows/deploy-cloudflare-workers.yml

          test ! -e cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v3.js
          test -e cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -Fq 'npx wrangler deploy' .github/workflows/deploy-kairos-canonical-worker.yml
          grep -Fq 'handleManuscriptPackageState(canonicalRequest, env, ctx)' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js
          test "$(grep -Fc 'handleManuscriptPackageState(canonicalRequest, env, ctx)' cloudflare/mmg-ios/src/kairos-production-entry-local-canonical-v1.js)" -eq 1
          grep -Fq 'from "./kairos-manuscript-deliverables-builder-v4.js"' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          grep -Fq "${DIGITAL_ASSET_PACKAGE_CONTRACT}" cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -Fq 'packageFiles.length !== 6' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          grep -Fq '"X-Kairos-Manuscript-Package-File-Count": "6"' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          grep -Fq 'canvaExcluded: true' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          for token in CUSTOMER_SPEC_SHEET_PDF KDP_INTERIOR_PDF DIGITAL_EDITION_V2_PDF COVER_PORTRAIT_PNG COVER_THUMBNAIL_PNG README_TXT ZIP_ARCHIVE; do
            grep -Fq "${token}" cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          done
          ! grep -Eiq 'canva\.com|from .*canva|import .*canva' \
            cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js \
            cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js \
            cloudflare/mmg-ios/src/kairos-manuscript-canonical-identity-router-v1.js \
            cloudflare/mmg-ios/src/kairos-manuscript-package-state-v1.js \
            cloudflare/mmg-ios/public/manuscript-studio.js

      - name: Validate active source chain
        working-directory: ${{ env.WORKER_DIRECTORY }}
        shell: bash
        run: |
          set -euxo pipefail
          test -f package.json
          test -f wrangler.toml
          test -f src/kairos-production-entry-canonical-publishing-v1.js
          test -f src/kairos-production-entry-local-canonical-v1.js
          test -f src/kairos-customer-runtime-projection-store-v1.js
          test -f src/kairos-customer-account-auth-v1.js
          test -f ../../web/kairos-dashboard/customer-portal.html
          test -f src/kairos-manuscript-canonical-identity-router-v1.js
          test -f src/kairos-manuscript-source-shard-v1.js
          test -f src/kairos-manuscript-package-state-v1.js
          test -f src/kairos-manuscript-deliverables-http-v1.js
          test -f src/kairos-manuscript-deliverables-builder-v4.js
          grep -Fq 'main = "src/kairos-production-entry-canonical-publishing-v1.js"' wrangler.toml
          grep -Fq 'KAIROS_SHOPIFY_CLIENT_ID = "0de689abad167c3e9b4197728bfd6b55"' wrangler.toml
          grep -Fq 'KAIROS_CUSTOMER_AUTH_CALLBACK_URL = "https://mmg-ios.info-mindsetmediagroup.workers.dev/api/customer/auth/callback"' wrangler.toml
          grep -Fq 'from "./kairos-production-entry-local-canonical-v1.js"' src/kairos-production-entry-canonical-publishing-v1.js
          grep -Fq "${PUBLISHING_ENTRY_BUILD}" src/kairos-production-entry-canonical-publishing-v1.js
          grep -Fq 'resolveCanonicalManuscriptRequest(request, env)' src/kairos-production-entry-local-canonical-v1.js
          grep -Fq 'handleManuscriptPackageState(canonicalRequest, env, ctx)' src/kairos-production-entry-local-canonical-v1.js
          grep -Fq 'handleDedicatedManuscriptSource(canonicalRequest, env)' src/kairos-production-entry-local-canonical-v1.js
          grep -Fq 'handleKairosCustomerRuntimeProjectionAPI(preparedCustomerRequest.request, env)' src/kairos-production-entry-local-canonical-v1.js
          grep -Fq 'handleKairosCustomerAccountAuth(request, env)' src/kairos-production-entry-local-canonical-v1.js
          grep -Fq "${CANONICAL_ENTRY_BUILD}" src/kairos-production-entry-local-canonical-v1.js
          grep -Fq "${CUSTOMER_AUTH_BUILD}" src/kairos-customer-account-auth-v1.js
          grep -Fq "${MANUSCRIPT_IDENTITY_BUILD}" src/kairos-manuscript-canonical-identity-router-v1.js
          node --check src/kairos-production-entry-canonical-publishing-v1.js
          node --check src/kairos-production-entry-local-canonical-v1.js
          node --check src/kairos-customer-runtime-projection-store-v1.js
          node --check src/kairos-customer-account-auth-v1.js
          node --check src/kairos-manuscript-canonical-identity-router-v1.js
          node --check src/kairos-manuscript-source-shard-v1.js
          node --check src/kairos-manuscript-package-state-v1.js
          node --check src/kairos-manuscript-deliverables-builder-v4.js
          node --check src/kairos-manuscript-deliverables-http-v1.js

      - name: Run customer runtime security tests
        run: npx vitest run backend-tests/kairos-customer-account-auth.test.ts backend-tests/kairos-customer-runtime-projection-store.test.ts backend-tests/kairos-customer-runtime-projection.test.ts backend-tests/kairos-customer-runtime-actions.test.ts

      - name: Install browser used by synthetic manuscript test
        run: npx playwright install --with-deps webkit

      - name: Run manuscript production synthetic E2E
        run: npx playwright test browser-tests/manuscript-pipeline-orchestrator.spec.mjs --project=webkit

      - name: Install Worker dependencies
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Validate deployable Worker bundle
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy canonical Worker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Deploy canonical Kairos Worker
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var "DEPLOYMENT_SHA:${GITHUB_SHA}" \
            --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify exact production deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="${RUNNER_TEMP}/deployment-identity-${attempt}.json"
            headers="${RUNNER_TEMP}/deployment-identity-${attempt}.headers"
            status="$(curl --silent --show-error --max-time 30 \
              -D "${headers}" \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${WORKER_BASE_URL}/api/deployment/identity?sha=${GITHUB_SHA}&attempt=${attempt}" \
              -o "${body}" -w '%{http_code}' || true)"
            echo "Canonical deployment verification ${attempt}/24 HTTP ${status}"
            cat "${body}" || true
            if [ "${status}" = "200" ] \
              && grep -Fq "\"deploymentSha\":\"${GITHUB_SHA}\"" "${body}" \
              && grep -qi "x-kairos-canonical-local: ${CANONICAL_ENTRY_BUILD}" "${headers}" \
              && grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}" \
              && grep -qi "x-kairos-manuscript-identity-build: ${MANUSCRIPT_IDENTITY_BUILD}" "${headers}"; then
              echo "Exact canonical Worker deployment is live."
              exit 0
            fi
            sleep 5
          done
          echo "The exact canonical Worker deployment could not be verified." >&2
          exit 1

      - name: Verify customer OAuth production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/customer-oauth.headers"
          body="${RUNNER_TEMP}/customer-oauth.body"
          status="$(curl --silent --show-error --max-time 30 \
            -D "${headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/api/customer/auth/start?verify=${GITHUB_SHA}" \
            -o "${body}" -w '%{http_code}')"
          echo "Customer OAuth entrypoint HTTP ${status}"
          test "${status}" = "302"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "${headers}")"
          test -n "${location}"
          printf '%s\n' "${location}" | grep -Fq 'client_id=0de689abad167c3e9b4197728bfd6b55'
          printf '%s\n' "${location}" | grep -Fq 'redirect_uri=https%3A%2F%2Fmmg-ios.info-mindsetmediagroup.workers.dev%2Fapi%2Fcustomer%2Fauth%2Fcallback'
          printf '%s\n' "${location}" | grep -Fq 'response_type=code'

          portal_headers="${RUNNER_TEMP}/customer-portal.headers"
          portal_status="$(curl --silent --show-error --max-time 30 \
            -D "${portal_headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/customer-portal?verify=${GITHUB_SHA}" \
            -o /dev/null -w '%{http_code}')"
          echo "Unauthenticated secure portal boundary HTTP ${portal_status}"
          test "${portal_status}" = "302"
          grep -qi "location: ${WORKER_BASE_URL}/api/customer/auth/start" "${portal_headers}"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${portal_headers}"
          echo "Verified Shopify Customer Account OAuth entrypoint and protected portal boundary."

      - name: Observe external Cloudflare Workers Build before final write
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          row=""
          for attempt in $(seq 1 120); do
            payload="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}")"
            row="$(printf '%s' "${payload}" | jq -c '[.check_runs[] | select(.name == "Workers Builds: mmg-ios" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last // empty')"
            if [ -n "${row}" ]; then
              echo "Observed external Cloudflare Workers Build for ${GITHUB_SHA}."
              break
            fi
            echo "External Workers Build has not appeared yet (${attempt}/120)."
            sleep 5
          done

          if [ -z "${row}" ]; then
            echo "No external Workers Build appeared in the guarded observation window. Canonical deployment remains authoritative."
            exit 0
          fi

          for attempt in $(seq 1 180); do
            payload="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}")"
            row="$(printf '%s' "${payload}" | jq -c '[.check_runs[] | select(.name == "Workers Builds: mmg-ios" and .app.slug == "cloudflare-workers-and-pages")] | sort_by(.started_at) | last // empty')"
            status="$(printf '%s' "${row}" | jq -r '.status // empty')"
            conclusion="$(printf '%s' "${row}" | jq -r '.conclusion // empty')"
            echo "External Workers Build status: ${status:-unknown} ${conclusion:-} (${attempt}/180)."
            if [ "${status}" = "completed" ]; then
              echo "External Cloudflare writer finished. Reasserting the exact canonical SHA now."
              exit 0
            fi
            sleep 5
          done

          echo "External Cloudflare Workers Build did not complete inside the guarded window; refusing to claim a stable final deployment." >&2
          exit 1

      - name: Reassert exact canonical Kairos Worker as final writer
        if: github.event_name == 'push'
        working-directory: ${{ env.WORKER_DIRECTORY }}
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --var "DEPLOYMENT_SHA:${GITHUB_SHA}" \
            --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify final exact production deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            body="${RUNNER_TEMP}/final-deployment-identity-${attempt}.json"
            headers="${RUNNER_TEMP}/final-deployment-identity-${attempt}.headers"
            status="$(curl --silent --show-error --max-time 30 \
              -D "${headers}" \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${WORKER_BASE_URL}/api/deployment/identity?sha=${GITHUB_SHA}&final=${attempt}" \
              -o "${body}" -w '%{http_code}' || true)"
            echo "Final canonical deployment verification ${attempt}/24 HTTP ${status}"
            cat "${body}" || true
            if [ "${status}" = "200" ] \
              && grep -Fq "\"deploymentSha\":\"${GITHUB_SHA}\"" "${body}" \
              && grep -qi "x-kairos-canonical-local: ${CANONICAL_ENTRY_BUILD}" "${headers}" \
              && grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}" \
              && grep -qi "x-kairos-manuscript-identity-build: ${MANUSCRIPT_IDENTITY_BUILD}" "${headers}"; then
              echo "Verified canonical Worker is the final exact-SHA production deployment."
              exit 0
            fi
            sleep 5
          done
          echo "Final exact canonical Worker deployment could not be verified." >&2
          exit 1

      - name: Verify final Customer Portal OAuth boundary
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/final-customer-oauth.headers"
          body="${RUNNER_TEMP}/final-customer-oauth.body"
          status="$(curl --silent --show-error --max-time 30 \
            -D "${headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/api/customer/auth/start?verify=${GITHUB_SHA}&final=1" \
            -o "${body}" -w '%{http_code}')"
          echo "Final Customer OAuth entrypoint HTTP ${status}"
          test "${status}" = "302"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${headers}"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "${headers}")"
          test -n "${location}"
          printf '%s\n' "${location}" | grep -Fq 'client_id=0de689abad167c3e9b4197728bfd6b55'
          printf '%s\n' "${location}" | grep -Fq 'redirect_uri=https%3A%2F%2Fmmg-ios.info-mindsetmediagroup.workers.dev%2Fapi%2Fcustomer%2Fauth%2Fcallback'
          printf '%s\n' "${location}" | grep -Fq 'response_type=code'

          portal_headers="${RUNNER_TEMP}/final-customer-portal.headers"
          portal_status="$(curl --silent --show-error --max-time 30 \
            -D "${portal_headers}" \
            -H 'Cache-Control: no-cache, no-store, must-revalidate' \
            "${WORKER_BASE_URL}/customer-portal?verify=${GITHUB_SHA}&final=1" \
            -o /dev/null -w '%{http_code}')"
          echo "Final unauthenticated secure portal boundary HTTP ${portal_status}"
          test "${portal_status}" = "302"
          grep -qi "location: ${WORKER_BASE_URL}/api/customer/auth/start" "${portal_headers}"
          grep -qi "x-kairos-customer-auth: ${CUSTOMER_AUTH_BUILD}" "${portal_headers}"
          echo "Verified final Shopify Customer Account OAuth entrypoint and protected portal boundary."
