name: Verify First Supervised Production Foundation

on:
  push:
    branches:
      - agent/run-first-supervised-foundation
    paths:
      - .github/workflows/run-first-supervised-foundation.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    name: Verify governed foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
      RUNTIME_PROJECT_ID: kproject_browser_20c52f4b-93d5-4482-aba2-0b9f3d47867f
      WORKFLOW_INSTANCE_ID: wf_fdYU3aWf8NH-qKLcV4nSz
    steps:
      - name: Report live validation pending
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-first-production-foundation\",\"description\":\"Verifying the governed production foundation\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Verify live Workflow projection
        shell: bash
        run: |
          set -euo pipefail
          verified="false"
          for attempt in $(seq 1 24); do
            http_code="$(curl --silent --show-error --max-time 30 \
              --output /tmp/kairos-workflows.json \
              --write-out '%{http_code}' \
              "${WORKER_URL}/api/workflows?validation=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [ "${http_code}" = "200" ] && node -e '
              const body = require("/tmp/kairos-workflows.json");
              const runtimeProjectId = process.argv[1];
              const instanceId = process.argv[2];
              const workflow = Array.isArray(body.workflows) ? body.workflows.find((item) => item.id === runtimeProjectId) : null;
              if (!workflow) process.exit(2);
              const reason = String(workflow.blockedReason || workflow.statusReason || workflow.summary || "");
              if (reason.includes("instance.invalid_id")) throw new Error(reason);
              if (["blocked", "cancelled"].includes(String(workflow.state || "").toLowerCase())) throw new Error(`Workflow entered ${workflow.state}: ${reason}`);
              if (String(workflow.workflowInstanceId || "") !== instanceId) process.exit(3);
              if (!["active", "pending", "queued"].includes(String(workflow.state || "").toLowerCase())) process.exit(4);
              console.log(JSON.stringify({ runtimeProjectId, workflowInstanceId: instanceId, state: workflow.state, actionRequired: workflow.actionRequired, canApprove: workflow.canApprove, nextAction: workflow.nextAction }, null, 2));
            ' "${RUNTIME_PROJECT_ID}" "${WORKFLOW_INSTANCE_ID}"; then
              verified="true"
              break
            fi
            sleep 5
          done
          test "${verified}" = "true"
          {
            echo "## First supervised production foundation"
            echo
            echo "- Runtime project: \`${RUNTIME_PROJECT_ID}\`"
            echo "- Workflow instance: \`${WORKFLOW_INSTANCE_ID}\`"
            echo "- Result: valid durable Workflow started and held behind explicit approval"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report live validation success
        if: ${{ success() }}
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-first-production-foundation\",\"description\":\"Valid Workflow started and awaiting explicit approval\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report live validation failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-first-production-foundation\",\"description\":\"Existing governed foundation projection failed verification\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
