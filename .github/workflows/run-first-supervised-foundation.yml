name: Run First Supervised Production Foundation

on:
  push:
    branches:
      - agent/run-first-supervised-foundation
    paths:
      - .github/workflows/run-first-supervised-foundation.yml

permissions:
  contents: read
  statuses: write

jobs:
  launch:
    name: Launch governed foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_URL: https://mmg-ios.info-mindsetmediagroup.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report live validation pending
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"pending\",\"context\":\"kairos-first-production-foundation\",\"description\":\"Launching the first governed production foundation\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Submit first supervised production objective
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          objective="Create the governed foundation for MMG's first supervised digital-asset production run. Manufacture a complete commercial production package for AI Image Mastery using the existing canonical MMG digital-download standard: authoritative source, manuscript production plan, customer-delivery package, product-media requirements, and a draft-only Shopify publication package. Preserve every explicit approval gate. Do not publish, change pricing, mutate the live storefront, spend funds, contact customers, or delete data."
          payload="$(node -e 'process.stdout.write(JSON.stringify({action:"objective",objective:process.argv[1]}))' "${objective}")"
          http_code="$(curl --silent --show-error --max-time 90 \
            --output /tmp/kairos-first-foundation.json \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "${payload}" \
            "${WORKER_URL}/api/hub/run")"
          cat /tmp/kairos-first-foundation.json
          test "${http_code}" = "202"
          node - <<'NODE'
          const body = require('/tmp/kairos-first-foundation.json');
          if (body.status !== 'accepted') throw new Error(`Unexpected status: ${body.status}`);
          if (!/^kproject_browser_[a-z0-9-]+$/i.test(String(body.runtimeProjectId || ''))) throw new Error('Runtime project ID is missing or invalid.');
          if (!String(body.workflowInstanceId || '').trim()) throw new Error('Cloudflare Workflow instance ID was not created.');
          if (String(body.workflow?.blockedReason || '').includes('instance.invalid_id')) throw new Error(body.workflow.blockedReason);
          console.log(`Runtime project: ${body.runtimeProjectId}`);
          console.log(`Workflow instance: ${body.workflowInstanceId}`);
          NODE
          runtime_project_id="$(node -p "require('/tmp/kairos-first-foundation.json').runtimeProjectId")"
          workflow_instance_id="$(node -p "require('/tmp/kairos-first-foundation.json').workflowInstanceId")"
          echo "runtime_project_id=${runtime_project_id}" >> "${GITHUB_OUTPUT}"
          echo "workflow_instance_id=${workflow_instance_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify live Workflow projection
        shell: bash
        env:
          RUNTIME_PROJECT_ID: ${{ steps.submit.outputs.runtime_project_id }}
          WORKFLOW_INSTANCE_ID: ${{ steps.submit.outputs.workflow_instance_id }}
        run: |
          set -euo pipefail
          verified="false"
          for attempt in $(seq 1 24); do
            http_code="$(curl --silent --show-error --max-time 30 \
              --output /tmp/kairos-workflows.json \
              --write-out '%{http_code}' \
              "${WORKER_URL}/api/workflows?validation=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [ "${http_code}" = "200" ] && node - "${RUNTIME_PROJECT_ID}" "${WORKFLOW_INSTANCE_ID}" <<'NODE'
            const body = require('/tmp/kairos-workflows.json');
            const runtimeProjectId = process.argv[2];
            const instanceId = process.argv[3];
            const workflow = Array.isArray(body.workflows) ? body.workflows.find((item) => item.id === runtimeProjectId) : null;
            if (!workflow) process.exit(2);
            const reason = String(workflow.blockedReason || workflow.statusReason || workflow.summary || '');
            if (reason.includes('instance.invalid_id')) throw new Error(reason);
            if (['blocked', 'cancelled'].includes(String(workflow.state || '').toLowerCase())) throw new Error(`Workflow entered ${workflow.state}: ${reason}`);
            if (String(workflow.workflowInstanceId || '') !== instanceId) process.exit(3);
            if (!['active', 'pending', 'queued'].includes(String(workflow.state || '').toLowerCase())) process.exit(4);
            console.log(JSON.stringify({
              runtimeProjectId,
              workflowInstanceId: instanceId,
              state: workflow.state,
              actionRequired: workflow.actionRequired,
              canApprove: workflow.canApprove,
              nextAction: workflow.nextAction,
            }, null, 2));
            NODE
            then
              verified="true"
              break
            fi
            sleep 5
          done
          test "${verified}" = "true"
          {
            echo "## First supervised production foundation"
            echo
            echo "- Runtime project: \`${RUNTIME_PROJECT_ID}\`"
            echo "- Workflow instance: \`${WORKFLOW_INSTANCE_ID}\`"
            echo "- Result: valid durable Workflow started and held behind explicit approval"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report live validation success
        if: ${{ success() }}
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"success\",\"context\":\"kairos-first-production-foundation\",\"description\":\"Valid Workflow started and awaiting explicit approval\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Report live validation failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"failure\",\"context\":\"kairos-first-production-foundation\",\"description\":\"First governed production foundation did not start cleanly\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
