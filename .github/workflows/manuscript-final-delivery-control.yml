name: Manuscript Final Delivery Control

on:
  push:
    branches:
      - main
      - fix/canonical-digital-asset-v2-main-20260805
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-final-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Validate canonical Digital Asset Edition V2 contracts
        run: |
          node --check cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          node --check cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          node --check cloudflare/mmg-ios/src/kairos-digital-asset-edition-v2-contract-v1.js
          node --check cloudflare/mmg-ios/src/kairos-creation-artifacts-v1.js
          node --check web/kairos-dashboard/scripts/manuscript-final-deliverable-engine.js
          grep -q 'mmg-digital-asset-edition-v2-customer-package-v1' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'packageFileCount: 6' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'MINIMUM_FINISHED_PAGES' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'canvaExcluded: true' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'Digital-Asset-Edition-V2_Customer-Package.zip' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-builder-v4.js
          grep -q 'X-Kairos-Manuscript-Package-File-Count.*6' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          grep -q 'ensureManufacturingSetup' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          ! grep -q 'mmg-locked-five-asset-kdp-delivery-package-v1' cloudflare/mmg-ios/src/kairos-manuscript-deliverables-http-v1.js
          ! grep -q 'GOLD_MASTER_DOCX' web/kairos-dashboard/scripts/manuscript-final-deliverable-engine.js
          ! grep -q 'KDP_FULL_WRAP_COVER_PDF' web/kairos-dashboard/scripts/manuscript-final-deliverable-engine.js

      - name: Verify exact six-file customer package, approved editorial authority, and legacy setup preservation
        run: |
          node --test \
            cloudflare/mmg-ios/test/kairos-manuscript-canonical-package-assets.test.js \
            cloudflare/mmg-ios/test/kairos-manuscript-approved-editorial-deliverables.test.js \
            cloudflare/mmg-ios/test/kairos-manuscript-legacy-setup-normalization.test.js

      - name: Install WebKit
        run: npx playwright install --with-deps webkit > /dev/null

      - name: Verify browser final-delivery control
        run: |
          npx playwright test \
            browser-tests/manuscript-final-delivery-control.spec.mjs \
            --project=webkit --workers=1

      - name: Validate Worker bundle
        working-directory: cloudflare/mmg-ios
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run
