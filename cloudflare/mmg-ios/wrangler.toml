name = "mmg-ios"
main = "src/kairos-production-entry-revenue-dashboard-v1.js"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]
keep_names = true
workers_dev = true
keep_vars = true

[assets]
directory = "../../web/kairos-dashboard"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "KAIROS_REVENUE_ASSETS"
bucket_name = "mmg-kairos-revenue-assets"
preview_bucket_name = "mmg-kairos-revenue-assets-preview"

[triggers]
crons = ["0 15 * * *", "0 2 * * *"]

[[durable_objects.bindings]]
name = "KAIROS_PROJECTS"
class_name = "KairosProject"

[[durable_objects.bindings]]
name = "KAIROS_PROJECT_AGENT"
class_name = "KairosProjectAgent"

[[workflows]]
name = "kairos-project-foundation-workflow"
binding = "KAIROS_PROJECT_WORKFLOW"
class_name = "KairosProjectFoundationWorkflow"

[[workflows]]
name = "kairos-manuscript-generation-workflow"
binding = "KAIROS_MANUSCRIPT_WORKFLOW"
class_name = "KairosManuscriptGenerationWorkflow"

[[migrations]]
tag = "native-publishing-v1"
new_sqlite_classes = ["KairosProject"]

[[migrations]]
tag = "kairos-project-agent-v1"
new_sqlite_classes = ["KairosProjectAgent"]

# Existing production secrets are retained by keep_vars=true.
# OPENAI_API_KEY and KAIROS_API_ACCESS_TOKEN must be Worker secrets, never plaintext vars.
# New manuscript generation starts through the persistent project Agent and Cloudflare Workflow.
# The stable generation-job endpoint is retained as the client contract and routes POST requests to the durable Workflow.
# The legacy alarm runner is available only when KAIROS_MANUSCRIPT_START_MODE is explicitly changed to legacy-alarm.
# Kairos never falls back to the legacy alarm runner automatically.
# The phone only starts and monitors jobs. It never owns model execution or production state.
# Product DRAFT creation and live publication remain available only through the exact approval-gated routes.
# Digital Asset Edition V2 and customer-delivery verification remain mandatory.
# Canonical approvals: Start Production Job, Approve Package, Approve & Publish Product.
# The production model uses the official OpenAI Responses API through the OPENAI_API_KEY Worker secret.
# Cloudflare neuron use remains disabled. Direct Shopify, theme, page, and navigation routes remain denied.

[vars]
SHOPIFY_STORE_DOMAIN = "07kd8e-qw.myshopify.com"
SHOPIFY_API_VERSION = "2026-07"
MMG_STOREFRONT_ORIGIN = "https://themindsetmediagroup.com"
KAIROS_OPENAI_MODEL = "gpt-5-mini"
KAIROS_MODEL_PROVIDER = "openai"
KAIROS_MODEL_ENDPOINT = "https://api.openai.com"
KAIROS_MODEL_NAME = "gpt-5-mini"
KAIROS_OPENAI_FREE_CREDITS_ENABLED = "false"
KAIROS_NO_COST_MODE = "false"
KAIROS_LOCAL_INFERENCE_ENABLED = "false"
KAIROS_CLOUDFLARE_NEURONS_ENABLED = "false"
KAIROS_MANUSCRIPT_RUNTIME_ENABLED = "true"
KAIROS_MANUSCRIPT_START_MODE = "workflow"
KAIROS_MANUSCRIPT_LEGACY_ALARM_ROLLBACK_ENABLED = "true"
KAIROS_DIGITAL_ASSET_V2_REQUIRED = "true"
KAIROS_SHOPIFY_WRITES_ENABLED = "true"
KAIROS_SHOPIFY_LIVE_PUBLISH_ENABLED = "true"
KAIROS_API_AUTH_MODE = "access-or-token"
KAIROS_API_RATE_LIMIT = "30"
KAIROS_API_RATE_WINDOW_SECONDS = "60"
KAIROS_API_AUDIT_RETENTION = "500"
