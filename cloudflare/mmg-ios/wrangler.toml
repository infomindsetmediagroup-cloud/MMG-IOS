name = "mmg-ios"
main = "src/kairos-production-entry-canonical-publishing-v1.js"
# Delegated local provider-firewall contract retained by the canonical publishing wrapper: main = "src/kairos-production-entry-local-canonical-v1.js"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]
keep_names = true
workers_dev = true
keep_vars = true

[assets]
directory = "../../web/kairos-dashboard"
binding = "ASSETS"
run_worker_first = ["/api/*", "/app", "/app/*", "/kairos", "/kairos/*", "/customer-portal", "/customer-portal/*"]
not_found_handling = "single-page-application"

[images]
binding = "IMAGES"

[triggers]
crons = ["0 15 * * *", "0 2 * * *", "0 * * * *"]

[[durable_objects.bindings]]
name = "KAIROS_PROJECTS"
class_name = "KairosProject"

[[durable_objects.bindings]]
name = "KAIROS_PROJECT_AGENT"
class_name = "KairosProjectAgent"

[[durable_objects.bindings]]
name = "KAIROS_MANUSCRIPT_SOURCES"
class_name = "KairosManuscriptSource"

[[durable_objects.bindings]]
name = "KAIROS_AUTONOMY_LEDGER"
class_name = "KairosAutonomyLedger"

[[workflows]]
name = "kairos-project-foundation-workflow"
binding = "KAIROS_PROJECT_WORKFLOW"
class_name = "KairosProjectFoundationWorkflow"

[[workflows]]
name = "kairos-manuscript-generation-workflow"
binding = "KAIROS_MANUSCRIPT_WORKFLOW"
class_name = "KairosManuscriptGenerationWorkflow"

[[migrations]]
tag = "native-publishing-v1"
new_sqlite_classes = ["KairosProject"]

[[migrations]]
tag = "kairos-project-agent-v1"
new_sqlite_classes = ["KairosProjectAgent"]

[[migrations]]
tag = "kairos-manuscript-source-shard-v1"
new_sqlite_classes = ["KairosManuscriptSource"]

[[migrations]]
tag = "kairos-autonomy-ledger-v1"
new_sqlite_classes = ["KairosAutonomyLedger"]

# Existing production secrets are retained by keep_vars=true, but the canonical local entry masks external inference credentials from runtime execution.
# Dashboard document and API routes execute Worker authentication before any UI or operations data is returned.
# Kairos dashboard APIs require a Shopify Admin ID token signed by the Kairos app secret and scoped to the exact MMG shop.
# Customer Portal routes use Shopify Customer Account OAuth with the same protected app-secret boundary and encrypted HttpOnly server sessions.
# Customer identity is resolved by Shopify Customer Account API and never trusted from browser-supplied customer IDs.
# The unauthenticated App Home response is a data-free bootstrap shell; durable operations data is returned only after server-side token verification.
# Revenue asset storage remains disabled until its account binding is separately provisioned.
# Browser, approval, manuscript, Shopify analytics, and governed runtime deployment must not depend on R2.
# New objectives enter through the operational browser execution bridge, persistent project Agent, and Cloudflare Workflows.
# Foundation approval queues local source generation; it does not call an external model provider.
# Authoritative-source and manuscript generation run locally through the same-origin WebLLM/WebGPU runtime.
# The Worker verifies and stores checksums, local-inference evidence, runtime transitions, and approval receipts.
# Legacy backend manuscript and revenue-generation routes are blocked by the local-only entry boundary.
# The canonical wrapper supplies a non-secret readiness sentinel only to non-generative objective and workflow projection routes.
# All other delegated routes receive empty provider credentials and cannot issue an OpenAI request.
# Product DRAFT creation and live publication remain available only through exact approval-gated routes.
# Digital Asset Edition V2 and customer-delivery verification remain mandatory.
# Canonical approvals: Approve Foundation, Start Local Production, Approve Package, Approve & Publish Product.
# Cloudflare neuron use and paid external inference remain disabled. Direct Shopify, theme, page, and navigation routes remain denied.
# Manuscript source sessions use one dedicated Durable Object per project and do not share the global production-registry object.
# The authenticated autonomy API is available through the canonical Worker boundary.
# Hourly autonomous operations use the governed collect, persist, prioritize, orchestrate, execute-safe, and record cycle.
# Certified execution is limited to website reinspection, collector refresh, internal incident recording, and inert repair proposals.
# GitHub, Cloudflare production deployment, Shopify, publication, and customer communication actions remain approval-required.

